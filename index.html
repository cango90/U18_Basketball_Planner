function readCollection(col){let filters=[],sort,take,single;const run=async()=>{try{let q=firestore.collection(col);filters.forEach(x=>q=q.where(x[0],'==',x[1]));const r=await q.get();let a=r.docs.map(dataOf);if(sort)a.sort((x,y)=>(x[sort[0]]>y[sort[0]]?1:-1)*(sort[1]==='desc'?-1:1));if(take)a=a.slice(0,take);return {data:single?(a[0]||null):a,error:null}}catch(error){return {data:null,error}}};return {select(){return this},eq(a,b){filters.push([a,b]);return this},order(a,b){sort=[a,b==='desc'?'desc':'asc'];return this},limit(x){take=x;return this},maybeSingle(){single=true;return this},then(a,b){return run().then(a,b)}}}
function mutate(col,kind,payload){let filters=[];const run=async()=>{try{let c=firestore.collection(col);if(kind==='insert')await c.add({...payload,created_at:firebase.firestore.FieldValue.serverTimestamp()});else if(kind==='upsert'){const id=DOC_IDS[col]?.(payload);if(!id)throw Error('Dokument-ID fehlt');await c.doc(id).set({...payload,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}else{const id=filters.find(x=>x[0]==='id')?.[1];if(id)await c.doc(id).set({...payload,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});else{filters.forEach(x=>c=c.where(x[0],'==',x[1]));const r=await c.get();await Promise.all(r.docs.map(d=>d.ref.set({...payload,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})))}}return {data:null,error:null}}catch(error){return {data:null,error}};return {eq(a,b){filters.push([a,b]);return this},then(a,b){return run().then(a,b)}}}}
const db={from:c=>({select:()=>readCollection(c),insert:x=>mutate(c,'insert',x),upsert:x=>mutate(c,'upsert',x),update:x=>mutate(c,'update',x)}),removeAllChannels(){},channel(){return {on(){return this},subscribe(){return this}}}};
let user,role='player',tab='home',boxscoreEvent=null,gameDetailEvent=null,events=[],attendance={},duties=[],messages=[],results={},stats=[],roster=[],requests=[];

function login(){
 app.innerHTML=`<section class="mx-auto mt-16 max-w-md text-center"><div class="text-5xl">🦁🏀</div><p class="mt-5 text-xs font-black tracking-[.2em] text-amber-400">SV LEONBERG/ELTINGEN</p><h1 class="mt-1 text-3xl font-black">Basketball Teamplaner</h1><p class="mt-2 text-zinc-400">Mit persönlicher Zugang-ID und Zugangscode anmelden.</p><form id="loginForm" class="card mt-8 rounded-3xl bg-zinc-900 p-5 text-left"><label class="text-sm font-bold">Zugang-ID</label><input name="id" required autocomplete="username" autocapitalize="none" class="mt-2 w-full rounded-xl bg-zinc-800 p-3 outline-none ring-amber-400 focus:ring-2" placeholder="z. B. berk"><label class="mt-4 block text-sm font-bold">Zugangscode</label><input name="code" required type="password" autocomplete="current-password" class="mt-2 w-full rounded-xl bg-zinc-800 p-3 outline-none ring-amber-400 focus:ring-2"><button class="${btn} mt-4 w-full bg-amber-400 text-black">Anmelden</button><p id="hint" class="mt-3 text-center text-xs text-zinc-400">Kein E-Mail-Login. Der Zugang funktioniert auf mehreren Geräten.</p></form></section>`;

async function load(){
 const membership=await db.from('team_memberships').select('role').eq('season_id',SEASON).eq('user_id',user.id).maybeSingle();role=user.email==='berk@teamplaner.invalid'?'club_admin':(membership.data?.role||null);
 if(!role){render();return}
 const [ev,at,du,msg,re,ro,st]=await Promise.all([
  db.from('events').select('*').eq('season_id',SEASON).order('starts_at'),
  db.from('attendance').select('*'),db.from('duty_assignments').select('*'),
  db.from('messages').select('*').eq('season_id',SEASON).order('created_at',{ascending:false}).limit(20),
  db.from('game_results').select('*'),db.from('roster_entries').select('*').eq('season_id',SEASON).order('full_name'),
  isCoach()?db.from('player_game_stats').select('*'):Promise.resolve({data:[]})
 ]);
 events=ev.data||[]; attendance={};(at.data||[]).forEach(x=>{(attendance[x.event_id]??={})[x.user_id]=x});duties=du.data||[];messages=msg.data||[];results={};(re.data||[]).forEach(x=>results[x.event_id]=x);roster=ro.data||[];stats=st.data||[];if(role==='club_admin'&&!events.length){seedTeamData(true);return}if(role==='club_admin'&&events.filter(e=>e.type==='game').length&&duties.length<events.filter(e=>e.type==='game').length*4){upgradeDuties();return}
 if(isCoach()){const rq=await db.from('access_requests').select('*,profiles(full_name)').eq('season_id',SEASON).eq('status','pending');requests=rq.data||[]}
 render();subscribe();
}
let unsubscribe=[];function subscribe(){unsubscribe.forEach(x=>x());unsubscribe=['events','attendance','duty_assignments','messages','game_results'].map(c=>firestore.collection(c).onSnapshot(()=>load()))}
function nav(){return `<nav class="fixed inset-x-0 bottom-0 z-10 border-t border-zinc-800 bg-zinc-950/95 backdrop-blur"><div class="mx-auto flex max-w-3xl justify-around p-2">${[['home','Home'],['termine','Spiele'],['kader','Kader'],['aufgaben','Aufgaben'],...(isCoach()?[['stats','Stats'],['admin','Trainer']]:[])].map(([id,label])=>`<button onclick="gameDetailEvent=null;tab='${id}';render()" class="${btn} ${tab===id?'bg-amber-400 text-black':'text-zinc-400'}">${label}</button>`).join('')}</div></nav>`}

function eventCard(e,hero=false){const a=attendance[e.id]||{}, yes=Object.values(a).filter(x=>x.status==='yes').length, mine=a[user.id]?.status,game=e.type==='game',result=results[e.id];return `<article class="${hero?'hero text-white':'bg-zinc-900'} card rounded-3xl p-5"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-widest ${hero?'text-amber-100':'text-amber-400'}">${game?(e.home?'🏀 Heimspiel':'🏀 Auswärtsspiel'):'🏀 Training'}</p><h2 class="mt-1 text-xl font-black">${game?(e.home?'vs ':'@ ')+esc(e.opponent):'Training'}</h2><p class="mt-1 text-sm opacity-80">${day(e.starts_at)} · ${new Date(e.starts_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</p></div>${status(mine)}</div><div class="mt-4 grid gap-2 text-sm sm:grid-cols-2"><span>📍 ${esc(e.location)}</span>${game?`<span>🕒 Treffzeit: ${e.meeting_at?new Date(e.meeting_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'folgt'}</span>`:''}</div>${result?`<p class="mt-4 rounded-xl bg-black/15 p-3 text-center text-lg font-black">Ergebnis: ${result.team_score} : ${result.opponent_score}</p>`:`<div class="mt-4"><div class="flex justify-between text-sm"><b>${yes} / 12 zugesagt</b><span>${yes<10?`Noch ${10-yes} bis Mindestkader`:'Kader steht'}</span></div><div class="mt-2 h-2 rounded-full bg-black/20"><div class="h-2 rounded-full bg-emerald-400" style="width:${Math.min(100,yes/12*100)}%"></div></div></div>`}<div class="mt-4 grid grid-cols-3 gap-2"><button onclick="answer('${e.id}','yes')" class="${btn} bg-emerald-500 text-white">Zusage</button><button onclick="answer('${e.id}','maybe')" class="${btn} bg-amber-300 text-black">Vielleicht</button><button onclick="answer('${e.id}','no')" class="${btn} bg-red-500 text-white">Absage</button></div></article>`}
function home(){const up=events.filter(e=>new Date(e.starts_at)>new Date()),game=up.find(e=>e.type==='game'),training=up.find(e=>e.type==='training'),mine=duties.filter(d=>d.assigned_to===user.id&&d.status!=='completed').slice(0,2);return `${game?eventCard(game,true):'<p class="text-zinc-400">Keine kommenden Spiele.</p>'}${training?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Nächstes Training</h2><div class="mt-3">${eventCard(training)}</div>`:''}${mine.length?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Meine Aufgabe</h2><div class="mt-3 space-y-2">${mine.map(dutyRow).join('')}</div>`:''}${messages.length?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Neuigkeiten</h2><div class="mt-3 space-y-2">${messages.slice(0,3).map(m=>`<div class="rounded-2xl bg-zinc-900 p-4 text-sm"><b>${esc(m.body)}</b><p class="mt-1 text-xs text-zinc-500">${fmt(m.created_at)}</p></div>`).join('')}</div>`:''}`}
function dutyRow(d){const e=events.find(x=>x.id===d.event_id),label=d.category==='kit_bag'?'Trikottasche':'Kampfgericht';const canClaim=!d.assigned_to||d.assigned_to===user.id;return `<div class="rounded-2xl bg-zinc-900 p-4"><div class="flex items-center justify-between gap-3"><div><b>${label}</b><p class="text-xs text-zinc-400">${e?day(e.starts_at):''} · ${d.status==='confirmed'?'Vom Trainer bestätigt':d.status==='claimed'?'Wartet auf Bestätigung':d.status==='completed'?'Erledigt':'Offen'}</p></div>${canClaim&&d.status==='open'?`<button onclick="claimDuty('${d.id}')" class="${btn} bg-amber-400 text-black">Übernehmen</button>`:''}</div></div>`}
function appointments(){const months={};events.forEach(e=>{const key=new Date(e.starts_at).toLocaleDateString('de-DE',{month:'long',year:'numeric'});(months[key]??=[]).push(e)});return `<h2 class="text-2xl font-black">Termine</h2>${Object.entries(months).map(([m,list])=>`<section class="mt-6"><h3 class="mb-3 text-sm font-black uppercase tracking-widest text-zinc-400">${m}</h3><div class="space-y-3">${list.map(e=>eventCard(e)).join('')}</div></section>`).join('')}`}

function statsView(){const players=roster.filter(r=>r.role==='player'&&r.profile_id);if(boxscoreEvent){const game=events.find(e=>e.id===boxscoreEvent);return `<div class="flex items-center justify-between"><h2 class="text-2xl font-black">Boxscore</h2><button onclick="boxscoreEvent=null;render()" class="text-sm text-zinc-400">Zurück</button></div><p class="mt-1 text-zinc-400">${esc(game?.opponent||'Spiel')}</p><form id="statsForm" class="mt-5 overflow-hidden rounded-3xl bg-zinc-900"><div class="grid grid-cols-[1fr_45px_45px_45px_45px] gap-1 border-b border-zinc-800 p-3 text-center text-xs font-black text-zinc-400"><span class="text-left">Spieler</span><span>2PM</span><span>3PM</span><span>FTM</span><span>PF</span></div>${players.map(p=>{const s=stats.find(x=>x.event_id===boxscoreEvent&&x.user_id===p.profile_id)||{};return `<div class="statRow grid grid-cols-[1fr_45px_45px_45px_45px] items-center gap-1 border-b border-zinc-800 p-3" data-user="${p.profile_id}"><b class="text-sm">${esc(p.full_name)}</b>${['two_pm','three_pm','ftm','pf'].map(k=>`<input type="number" min="0" name="${k}" value="${s[k]??0}" class="w-full rounded-lg bg-zinc-800 p-2 text-center">`).join('')}</div>`}).join('')}<button class="${btn} m-4 w-[calc(100%-2rem)] bg-amber-400 text-black">Boxscore speichern</button></form>`}const total={};stats.forEach(s=>{const t=total[s.user_id]??={gp:new Set(),two_pm:0,three_pm:0,ftm:0,pf:0,pts:0};t.gp.add(s.event_id);t.two_pm+=s.two_pm;t.three_pm+=s.three_pm;t.ftm+=s.ftm;t.pf+=s.pf;t.pts+=s.points});const completed=events.filter(e=>e.type==='game'&&results[e.id]);return `<h2 class="text-2xl font-black">Saisonstatistik</h2><p class="mt-1 text-sm text-zinc-400">Nur Trainer sehen diese Ansicht.</p><section class="mt-5 overflow-x-auto rounded-3xl bg-zinc-900"><table class="w-full text-sm"><thead class="text-left text-xs text-zinc-400"><tr><th class="p-3">Spieler</th><th>Sp.</th><th>2PM</th><th>3PM</th><th>FTM</th><th>PF</th><th>PTS</th><th>PPS</th></tr></thead><tbody>${players.map(p=>{const t=total[p.profile_id]||{gp:new Set(),two_pm:0,three_pm:0,ftm:0,pf:0,pts:0};const g=t.gp.size;return `<tr class="border-t border-zinc-800"><td class="p-3 font-bold">${esc(p.full_name)}</td><td>${g}</td><td>${t.two_pm}</td><td>${t.three_pm}</td><td>${t.ftm}</td><td>${t.pf}</td><td class="font-bold">${t.pts}</td><td>${g?(t.pts/g).toFixed(1):'–'}</td></tr>`}).join('')||'<tr><td class="p-3">Noch keine freigeschalteten Spieler.</td></tr>'}</tbody></table></section><h3 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Spiele mit Ergebnis</h3><div class="mt-3 space-y-2">${completed.length?completed.map(e=>`<button onclick="boxscoreEvent='${e.id}';render()" class="flex w-full items-center justify-between rounded-2xl bg-zinc-900 p-4 text-left"><span><b>${esc(e.home?'vs ':'@ ')+esc(e.opponent)}</b><span class="block text-xs text-zinc-400">${results[e.id].team_score} : ${results[e.id].opponent_score}</span></span><span class="text-amber-400">Boxscore ›</span></button>`).join(''):'<p class="rounded-2xl bg-zinc-900 p-4 text-sm text-zinc-400">Noch kein Ergebnis eingetragen.</p>'}</div>`}

function myStatCards(){const own=statTotal(me.uid), pps=own.games?Math.round(own.points/own.games*10)/10:'–';return `<section class="mt-5"><h2 class="mb-3 text-lg font-black">Meine Saison</h2><div class="grid grid-cols-3 gap-2"><div class="${card} p-3"><p class="text-xs text-zinc-400">Punkte</p><b class="text-xl text-sky-300">${own.points}</b></div><div class="${card} p-3"><p class="text-xs text-zinc-400">Dreier</p><b class="text-xl text-sky-300">${own.three}</b></div><div class="${card} p-3"><p class="text-xs text-zinc-400">PPS</p><b class="text-xl text-sky-300">${pps}</b></div></div></section>`}
function news(){return messages.length?`<section class="mt-5"><h2 class="mb-3 text-lg font-black">Team-Updates</h2><div class="space-y-2">${messages.slice(0,3).map(m=>`<div class="${card} p-4 text-sm"><b>${esc(m.body)}</b></div>`).join('')}</div></section>`:''}
function gamesView(){if(detail)return detailView();const games=upcoming().filter(x=>x.type==='game'), months=[...new Set(events.filter(x=>x.type==='game').map(x=>x.starts_at.slice(0,7)))];let shown=gameFilter==='upcoming'?games.slice(0,5):gameFilter==='all'?events.filter(x=>x.type==='game'):events.filter(x=>x.type==='game'&&x.starts_at.startsWith(gameFilter));return `<h2 class="text-2xl font-black">Spiele</h2><p class="mt-1 text-sm text-zinc-400">Die nächsten fünf zuerst – die ganze Saison bleibt einen Klick entfernt.</p><div class="mt-4 flex gap-2 overflow-x-auto pb-2">${[['upcoming','Nächste 5'],['all','Ganze Saison'],...months.map(m=>[m,new Intl.DateTimeFormat('de-DE',{month:'short',year:'numeric'}).format(new Date(m+'-01T12:00:00'))])].map(x=>`<button onclick="gameFilter='${x[0]}';render()" class="${button} shrink-0 ${gameFilter===x[0]?'bg-sky-400 text-zinc-950':'bg-zinc-800 text-zinc-300'}">${x[1]}</button>`).join('')}</div><div class="mt-4 space-y-3">${shown.map(eventItem).join('')||'<p class="text-zinc-400">Keine Spiele.</p>'}</div>`}
function trainingView(){if(detail)return detailView();const all=upcoming().filter(x=>x.type==='training'), shown=showAllTraining?all:all.slice(0,10);return `<h2 class="text-2xl font-black">Training</h2><p class="mt-1 text-sm text-zinc-400">${showAllTraining?'Alle kommenden Einheiten kompakt.':'Die nächsten zehn Einheiten.'}</p><div class="mt-4 space-y-2">${shown.map(e=>eventItem(e,true)).join('')}</div>${all.length>10?`<button onclick="showAllTraining=!showAllTraining;render()" class="${button} mt-4 w-full bg-zinc-800 text-sky-300">${showAllTraining?'Kompakt anzeigen':'Alle Trainings öffnen'}</button>`:''}`}
function openEvent(id){detail=id;render()}
function detailView(){const e=events.find(x=>x.id===detail);if(!e)return '';const game=e.type==='game', roleDuties=duties.filter(d=>d.event_id===e.id), team=people();return `<button onclick="detail=null;render()" class="text-sm font-bold text-zinc-400">← Zurück</button><h2 class="mt-4 text-2xl font-black">${game?(e.home?'vs ':'@ ')+esc(e.opponent):'Training'}</h2><p class="mt-1 text-zinc-400">${dfmt(e.starts_at)} · ${time(e.starts_at)}</p><a target="_blank" rel="noopener" href="${maps(e.location)}" class="mt-2 inline-block text-sm font-bold text-sky-300 underline">📍 ${esc(e.location)} in Google öffnen</a><section class="${card} mt-5"><h3 class="font-black">Meine Rückmeldung</h3><div class="mt-4 grid grid-cols-3 gap-2"><button onclick="rsvp('${e.id}','yes')" class="${button} bg-emerald-500">Zusage</button><button onclick="rsvp('${e.id}','maybe')" class="${button} bg-amber-300 text-zinc-950">Vielleicht</button><button onclick="rsvp('${e.id}','no')" class="${button} bg-rose-500">Absage</button></div></section>${game?`<section class="${card} mt-4"><h3 class="font-black">Kampfgericht</h3><p class="mt-1 text-sm text-zinc-400">Alle vier Aufgaben gehören zu diesem Spiel.</p><div class="mt-4 space-y-2">${roleDuties.map(dutyLine).join('')}</div></section>`:''}<section class="${card} mt-4"><h3 class="font-black">Kader & Rückmeldungen</h3><div class="mt-3 space-y-2 text-sm">${team.map(p=>`<div class="flex items-center justify-between"><span>${esc(p.full_name)}</span>${response(e.id,p.profile_id)?.status?responseBadge(response(e.id,p.profile_id).status):responseBadge()}</div>`).join('')}</div></section>`}
function dutyLine(d){const who=roster.find(p=>p.profile_id===d.assigned_to)?.full_name||'Offen', label={shotclock:'24 Sekunden / Shotclock',scorer:'Anschreiber · NBB/iPad',timekeeper:'Anzeigetafel & Zeitnahme',kit_bag:'Trikottasche'}[d.category]||d.category;let actions=d.assigned_to?`<span class="text-xs font-bold ${d.status==='completed'?'text-emerald-400':'text-sky-300'}">${d.status==='completed'?'Bestätigt':esc(who)}</span>`:`<button onclick="claim('${d.id}')" class="${button} bg-sky-400 text-zinc-950">Übernehmen</button>`;if(coach()&&d.status==='claimed')actions+=` <button onclick="confirmDuty('${d.id}')" class="${button} bg-emerald-500">Bestätigen</button>`;if(coach()&&!d.assigned_to)actions+=` <button onclick="assignDuty('${d.id}')" class="${button} bg-zinc-800 text-sky-300">Zuteilen</button>`;return `<div class="flex items-center justify-between gap-3 rounded-2xl bg-zinc-800/80 p-3"><div><b class="text-sm">${label}</b>${d.category==='scorer'?'<a target="_blank" rel="noopener" href="https://www.basketball-bund.net/" class="ml-2 text-xs text-sky-300 underline">NBB öffnen</a>':''}<span class="block text-xs text-zinc-400">${esc(who)}</span></div><div class="flex shrink-0 items-center gap-1">${actions}</div></div>`}
function rosterView(){const rows=roster.sort((a,b)=>(a.role||'').localeCompare(b.role||'')||a.full_name.localeCompare(b.full_name));return `<h2 class="text-2xl font-black">Team</h2><p class="mt-1 text-sm text-zinc-400">${people().length} Spieler · ${roster.filter(x=>x.role==='coach').length} Trainer</p><div class="mt-5 space-y-2">${rows.map(p=>{const positions=p.profile_id===me.uid?(profile.positions||p.positions):p.positions;return `<div class="${card} flex items-center justify-between p-4"><div><b>${esc(p.full_name)}</b><p class="text-xs text-zinc-400">${positions?.join(' · ')||'Position folgt'}</p></div><span class="text-xs font-bold ${p.role==='coach'?'text-sky-300':'text-violet-300'}">${p.role==='coach'?'Trainer':'Spieler'}</span></div>`}).join('')}</div>${positionSetup()}`}
function positionSetup(){if(!me||coach()||profile.positions?.length>=2)return '';return `<section class="${card} mt-5"><h3 class="font-black">Deine Positionen</h3><p class="mt-1 text-sm text-zinc-400">Wähle zwei oder drei Positionen, um dein Profil freizuschalten.</p><div class="mt-3 grid grid-cols-2 gap-2">${POSITIONS.map(p=>`<label class="rounded-xl bg-zinc-800 p-3 text-sm"><input class="mr-2 pos" type="checkbox" value="${p}"> ${p}</label>`).join('')}</div><button onclick="savePositions()" class="${button} mt-4 bg-sky-400 text-zinc-950">Profil speichern</button></section>`}
function dutyView(){const completed=duties.filter(d=>d.status==='completed'), count=id=>completed.filter(d=>d.assigned_to===id).length;return `<h2 class="text-2xl font-black">Aufgaben-Historie</h2><p class="mt-1 text-sm text-zinc-400">Bestätigte Schichten der gesamten Saison.</p><div class="${card} mt-5 overflow-hidden p-0">${people().sort((a,b)=>count(b.profile_id)-count(a.profile_id)).map(p=>`<div class="flex items-center justify-between border-b border-white/[.06] p-4"><div><b>${esc(p.full_name)}</b><p class="text-xs text-zinc-400">${completed.filter(d=>d.assigned_to===p.profile_id).map(d=>dfmt(events.find(e=>e.id===d.event_id)?.starts_at||'')).slice(-3).join(' · ')||'Noch keine Schicht'}</p></div><b class="text-sky-300">${count(p.profile_id)}×</b></div>`).join('')}</div>`}
function statTotal(id){const own=stats.filter(s=>s.user_id===id);const games=new Set(own.map(s=>s.event_id)).size;const two=own.reduce((a,s)=>a+(+s.two_pm||0),0),three=own.reduce((a,s)=>a+(+s.three_pm||0),0),ft=own.reduce((a,s)=>a+(+s.ftm||0),0);return {games,two,three,ft,points:two*2+three*3+ft}}
function podium(key,label){const top=people().map(p=>({...p,value:statTotal(p.profile_id)[key]})).sort((a,b)=>b.value-a.value).slice(0,3);return `<section class="${card} p-4"><h3 class="text-sm font-black text-sky-300">${label}</h3><div class="mt-3 flex items-end justify-center gap-2">${top.map((p,i)=>`<div class="flex w-1/3 flex-col items-center"><b class="text-xs text-center">${esc(p.full_name.split(' ')[0])}</b><div class="mt-2 grid w-full place-items-center rounded-t-xl bg-${i===0?'sky-400 text-zinc-950 h-20':i===1?'zinc-600 h-14':'amber-700 h-10'} font-black">${p.value}</div><span class="mt-1 text-xs text-zinc-400">${i===0?'1.':i===1?'2.':'3.'}</span></div>`).join('')}</div></section>`}
function statsView(){const own=statTotal(me.uid);const rows=people().map(p=>({...p,t:statTotal(p.profile_id)})).sort((a,b)=>b.t.points-a.t.points), teamStats=coach()?`<div class="mt-4 grid gap-3 sm:grid-cols-3">${podium('two','Top 3 Zweier')}${podium('three','Top 3 Dreier')}${podium('ft','Top 3 Freiwürfe')}</div><section class="${card} mt-4 overflow-x-auto p-0"><table class="w-full text-sm"><thead class="text-left text-xs text-zinc-400"><tr><th class="p-3">Spieler</th><th>Sp.</th><th>PTS</th><th>2PM</th><th>3PM</th><th>FTM</th></tr></thead><tbody>${rows.map(p=>`<tr class="border-t border-white/[.06]"><td class="p-3 font-bold">${esc(p.full_name)}</td><td>${p.t.games}</td><td>${p.t.points}</td><td>${p.t.two}</td><td>${p.t.three}</td><td>${p.t.ft}</td></tr>`).join('')}</tbody></table></section>`:`<p class="mt-4 text-sm text-zinc-400">Team-Ranglisten und individuelle Werte anderer Spieler bleiben geschützt.</p>`;return `<h2 class="text-2xl font-black">Saisonstatistik</h2><p class="mt-1 text-sm text-zinc-400">Deine Werte${coach()?' und der Überblick über das Team.':'.'}</p><section class="${card} mt-5"><p class="text-xs font-black tracking-widest text-sky-300">DEINE WERTE</p><div class="mt-3 grid grid-cols-4 gap-2 text-center text-sm"><div><b class="block text-xl">${own.points}</b><span class="text-zinc-400">PTS</span></div><div><b class="block text-xl">${own.two}</b><span class="text-zinc-400">2PM</span></div><div><b class="block text-xl">${own.three}</b><span class="text-zinc-400">3PM</span></div><div><b class="block text-xl">${own.ft}</b><span class="text-zinc-400">FTM</span></div></div></section>${teamStats}`}
function coachView(){const open=duties.filter(d=>!d.assigned_to).length, claimed=duties.filter(d=>d.status==='claimed');return `<h2 class="text-2xl font-black">Trainerbereich</h2><div class="mt-5 grid gap-3 sm:grid-cols-2"><section class="${card}"><h3 class="font-black">Offene Aufgaben</h3><p class="mt-1 text-3xl font-black text-sky-300">${open}</p><p class="mt-1 text-sm text-zinc-400">Du kannst sie in der Spielansicht direkt zuteilen.</p></section><section class="${card}"><h3 class="font-black">Zur Bestätigung</h3><p class="mt-1 text-3xl font-black text-emerald-400">${claimed.length}</p><p class="mt-1 text-sm text-zinc-400">Übernommene Schichten prüfen.</p></section></div><section class="${card} mt-4"><h3 class="font-black">Nachricht ans Team</h3><form id="message" class="mt-3 flex gap-2"><input required name="body" class="min-w-0 flex-1 rounded-xl bg-zinc-800 p-3" placeholder="z. B. Treffzeit wird noch bekannt gegeben"><button class="${button} bg-sky-400 text-zinc-950">Senden</button></form></section>`}
function render(){if(!membership&&!me?.email?.startsWith('berk@')){app.innerHTML=`<section class="mx-auto mt-20 max-w-md ${card} text-center"><h1 class="text-2xl font-black">Zugang noch nicht freigeschaltet</h1><p class="mt-2 text-zinc-400">Bitte wende dich an dein Trainerteam. Dein Zugang wird dann dem U18-Team zugeordnet.</p><button onclick="signout()" class="mt-5 text-sm text-zinc-400">Abmelden</button></section>`;return}const body={home, games:gamesView,training:trainingView,roster:rosterView,duties:dutyView,stats:statsView,coach:coachView}[page]();app.innerHTML=header()+'<section>'+body+'</section>'+nav();document.querySelector('#message')?.addEventListener('submit',sendMessage)}
async function rsvp(eventId,status){let reason=null;if(status==='no')reason=prompt('Absagegrund (optional)')||'';await store.collection('attendance').doc(eventId+'_'+me.uid).set({event_id:eventId,user_id:me.uid,status,absence_reason:reason,updated_at:new Date().toISOString()},{merge:true});await load()}
async function claim(id){await store.collection('duty_assignments').doc(id).update({assigned_to:me.uid,status:'claimed',claimed_at:new Date().toISOString()});await load()}
async function confirmDuty(id){await store.collection('duty_assignments').doc(id).update({status:'completed',confirmed_by:me.uid,confirmed_at:new Date().toISOString()});await load()}
async function assignDuty(id){const choices=people().map((p,i)=>`${i+1}. ${p.full_name}`).join('\n'), pick=+prompt('Spieler auswählen:\n'+choices);if(!pick||!people()[pick-1])return;await store.collection('duty_assignments').doc(id).update({assigned_to:people()[pick-1].profile_id,status:'claimed',assigned_by:me.uid});await load()}
async function sendMessage(e){e.preventDefault();const body=new FormData(e.target).get('body').trim();await store.collection('messages').add({season_id:SEASON,author_id:me.uid,body,created_at:new Date().toISOString()});e.target.reset();await load()}
async function savePositions(){const selected=[...document.querySelectorAll('.pos:checked')].map(x=>x.value);if(selected.length<2||selected.length>3)return alert('Bitte wähle mindestens zwei und höchstens drei Positionen.');await store.collection('player_profiles').doc(me.uid).set({positions:selected,updated_at:new Date().toISOString()},{merge:true});await load()}
async function seed(){if(!admin()||!confirm('Kader, Saisonspiele, Trainings und Aufgaben werden geprüft und fehlende Startdaten ergänzt.'))return;const batch=store.batch();PLAYERS.forEach(name=>batch.set(store.collection('roster_entries').doc(uid(name)),{season_id:SEASON,full_name:name,role:'player',active:true,profile_id:null,positions:[]},{merge:true}));COACHES.forEach((name,i)=>batch.set(store.collection('roster_entries').doc(uid(name)),{season_id:SEASON,full_name:name,role:'coach',active:true,profile_id:i===0?me.uid:null,positions:[]},{merge:true}));GAMES.forEach((g,i)=>{let id='game-'+String(i+1).padStart(2,'0'), start=g[0]+'T14:00:00';batch.set(store.collection('events').doc(id),{season_id:SEASON,type:'game',starts_at:start,meeting_at:start,opponent:g[1],location:g[2],home:g[3]},{merge:true});[['shotclock','24 Sekunden / Shotclock'],['scorer','Anschreiber · NBB/iPad'],['timekeeper','Anzeigetafel & Zeitnahme'],['kit_bag','Trikottasche']].forEach(([category])=>batch.set(store.collection('duty_assignments').doc(id+'_'+category),{event_id:id,category,status:'open',assigned_to:null},{merge:true}))});TRAININGS.forEach((date,i)=>batch.set(store.collection('events').doc('training-'+String(i+1).padStart(2,'0')),{season_id:SEASON,type:'training',starts_at:date+'T18:45:00',location:'Georgii-Halle, Leonberg',home:true},{merge:true}));await batch.commit();await load()}
async function signout(){await auth.signOut()}
function loadError(error){console.error(error);app.innerHTML=`<section class="mx-auto mt-20 max-w-md ${card} text-center"><div class="text-4xl">⚠️</div><h1 class="mt-3 text-xl font-black">Daten konnten nicht geladen werden</h1><p class="mt-2 text-sm text-zinc-400">Bitte aktualisiere die Firestore-Regeln im Firebase-Projekt und lade die Seite danach erneut.</p><p class="mt-3 rounded-xl bg-zinc-800 p-3 text-left text-xs text-zinc-400">${esc(error?.message||'Unbekannter Fehler')}</p><button onclick="location.reload()" class="${button} mt-4 bg-sky-400 text-zinc-950">Erneut versuchen</button></section>`}
auth.onAuthStateChanged(async u=>{me=u?{uid:u.uid,email:u.email}:null;if(!u)return login();try{await load()}catch(error){loadError(error)}});
</script>
</body>
</html>
