const dataOf=d=>{const x=d.data();return {...x,id:d.id,created_at:x.created_at?.toDate?.()?.toISOString()||x.created_at}};
function readCollection(col){let filters=[],sort,take,single;const run=async()=>{try{let q=firestore.collection(col);filters.forEach(x=>q=q.where(x[0],'==',x[1]));const r=await q.get();let a=r.docs.map(dataOf);if(sort)a.sort((x,y)=>(x[sort[0]]>y[sort[0]]?1:-1)*(sort[1]==='desc'?-1:1));if(take)a=a.slice(0,take);return {data:single?(a[0]||null):a,error:null}}catch(error){return {data:null,error}}};return {select(){return this},eq(a,b){filters.push([a,b]);return this},order(a,b){sort=[a,b==='desc'?'desc':'asc'];return this},limit(x){take=x;return this},maybeSingle(){single=true;return this},then(a,b){return run().then(a,b)}}}
function mutate(col,kind,payload){let filters=[];const run=async()=>{try{let c=firestore.collection(col);if(kind==='insert')await c.add({...payload,created_at:firebase.firestore.FieldValue.serverTimestamp()});else if(kind==='upsert'){const id=DOC_IDS[col]?.(payload);if(!id)throw Error('Dokument-ID fehlt');await c.doc(id).set({...payload,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}else{const id=filters.find(x=>x[0]==='id')?.[1];if(id)await c.doc(id).set({...payload,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});else{filters.forEach(x=>c=c.where(x[0],'==',x[1]));const r=await c.get();await Promise.all(r.docs.map(d=>d.ref.set({...payload,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})))}}return {data:null,error:null}}catch(error){return {data:null,error}};return {eq(a,b){filters.push([a,b]);return this},then(a,b){return run().then(a,b)}}}}
const db={from:c=>({select:()=>readCollection(c),insert:x=>mutate(c,'insert',x),upsert:x=>mutate(c,'upsert',x),update:x=>mutate(c,'update',x)}),removeAllChannels(){},channel(){return {on(){return this},subscribe(){return this}}}};
let user,role='player',tab='home',boxscoreEvent=null,gameDetailEvent=null,events=[],attendance={},duties=[],messages=[],results={},stats=[],roster=[],requests=[];

function login(){
 app.innerHTML=`<section class="mx-auto mt-16 max-w-md text-center"><div class="text-5xl">🦁🏀</div><p class="mt-5 text-xs font-black tracking-[.2em] text-amber-400">SV LEONBERG/ELTINGEN</p><h1 class="mt-1 text-3xl font-black">Basketball Teamplaner</h1><p class="mt-2 text-zinc-400">Mit persönlicher Zugang-ID und Zugangscode anmelden.</p><form id="loginForm" class="card mt-8 rounded-3xl bg-zinc-900 p-5 text-left"><label class="text-sm font-bold">Zugang-ID</label><input name="id" required autocomplete="username" autocapitalize="none" class="mt-2 w-full rounded-xl bg-zinc-800 p-3 outline-none ring-amber-400 focus:ring-2" placeholder="z. B. berk"><label class="mt-4 block text-sm font-bold">Zugangscode</label><input name="code" required type="password" autocomplete="current-password" class="mt-2 w-full rounded-xl bg-zinc-800 p-3 outline-none ring-amber-400 focus:ring-2"><button class="${btn} mt-4 w-full bg-amber-400 text-black">Anmelden</button><p id="hint" class="mt-3 text-center text-xs text-zinc-400">Kein E-Mail-Login. Der Zugang funktioniert auf mehreren Geräten.</p></form></section>`;

async function load(){
 const membership=await db.from('team_memberships').select('role').eq('season_id',SEASON).eq('user_id',user.id).maybeSingle();role=user.email==='berk@teamplaner.invalid'?'club_admin':(membership.data?.role||null);
 if(!role){render();return}
 const [ev,at,du,msg,re,ro,st]=await Promise.all([
  db.from('events').select('*').eq('season_id',SEASON).order('starts_at'),
  db.from('attendance').select('*'),db.from('duty_assignments').select('*'),
  db.from('messages').select('*').eq('season_id',SEASON).order('created_at',{ascending:false}).limit(20),
  db.from('game_results').select('*'),db.from('roster_entries').select('*').eq('season_id',SEASON).order('full_name'),
  isCoach()?db.from('player_game_stats').select('*'):Promise.resolve({data:[]})
 ]);
 events=ev.data||[]; attendance={};(at.data||[]).forEach(x=>{(attendance[x.event_id]??={})[x.user_id]=x});duties=du.data||[];messages=msg.data||[];results={};(re.data||[]).forEach(x=>results[x.event_id]=x);roster=ro.data||[];stats=st.data||[];if(role==='club_admin'&&!events.length){seedTeamData(true);return}if(role==='club_admin'&&events.filter(e=>e.type==='game').length&&duties.length<events.filter(e=>e.type==='game').length*4){upgradeDuties();return}
 if(isCoach()){const rq=await db.from('access_requests').select('*,profiles(full_name)').eq('season_id',SEASON).eq('status','pending');requests=rq.data||[]}
 render();subscribe();
}
let unsubscribe=[];function subscribe(){unsubscribe.forEach(x=>x());unsubscribe=['events','attendance','duty_assignments','messages','game_results'].map(c=>firestore.collection(c).onSnapshot(()=>load()))}
function nav(){return `<nav class="fixed inset-x-0 bottom-0 z-10 border-t border-zinc-800 bg-zinc-950/95 backdrop-blur"><div class="mx-auto flex max-w-3xl justify-around p-2">${[['home','Home'],['termine','Spiele'],['kader','Kader'],['aufgaben','Aufgaben'],...(isCoach()?[['stats','Stats'],['admin','Trainer']]:[])].map(([id,label])=>`<button onclick="gameDetailEvent=null;tab='${id}';render()" class="${btn} ${tab===id?'bg-amber-400 text-black':'text-zinc-400'}">${label}</button>`).join('')}</div></nav>`}

function eventCard(e,hero=false){const a=attendance[e.id]||{}, yes=Object.values(a).filter(x=>x.status==='yes').length, mine=a[user.id]?.status,game=e.type==='game',result=results[e.id];return `<article class="${hero?'hero text-white':'bg-zinc-900'} card rounded-3xl p-5"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-widest ${hero?'text-amber-100':'text-amber-400'}">${game?(e.home?'🏀 Heimspiel':'🏀 Auswärtsspiel'):'🏀 Training'}</p><h2 class="mt-1 text-xl font-black">${game?(e.home?'vs ':'@ ')+esc(e.opponent):'Training'}</h2><p class="mt-1 text-sm opacity-80">${day(e.starts_at)} · ${new Date(e.starts_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</p></div>${status(mine)}</div><div class="mt-4 grid gap-2 text-sm sm:grid-cols-2"><span>📍 ${esc(e.location)}</span>${game?`<span>🕒 Treffzeit: ${e.meeting_at?new Date(e.meeting_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'folgt'}</span>`:''}</div>${result?`<p class="mt-4 rounded-xl bg-black/15 p-3 text-center text-lg font-black">Ergebnis: ${result.team_score} : ${result.opponent_score}</p>`:`<div class="mt-4"><div class="flex justify-between text-sm"><b>${yes} / 12 zugesagt</b><span>${yes<10?`Noch ${10-yes} bis Mindestkader`:'Kader steht'}</span></div><div class="mt-2 h-2 rounded-full bg-black/20"><div class="h-2 rounded-full bg-emerald-400" style="width:${Math.min(100,yes/12*100)}%"></div></div></div>`}<div class="mt-4 grid grid-cols-3 gap-2"><button onclick="answer('${e.id}','yes')" class="${btn} bg-emerald-500 text-white">Zusage</button><button onclick="answer('${e.id}','maybe')" class="${btn} bg-amber-300 text-black">Vielleicht</button><button onclick="answer('${e.id}','no')" class="${btn} bg-red-500 text-white">Absage</button></div></article>`}
function home(){const up=events.filter(e=>new Date(e.starts_at)>new Date()),game=up.find(e=>e.type==='game'),training=up.find(e=>e.type==='training'),mine=duties.filter(d=>d.assigned_to===user.id&&d.status!=='completed').slice(0,2);return `${game?eventCard(game,true):'<p class="text-zinc-400">Keine kommenden Spiele.</p>'}${training?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Nächstes Training</h2><div class="mt-3">${eventCard(training)}</div>`:''}${mine.length?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Meine Aufgabe</h2><div class="mt-3 space-y-2">${mine.map(dutyRow).join('')}</div>`:''}${messages.length?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Neuigkeiten</h2><div class="mt-3 space-y-2">${messages.slice(0,3).map(m=>`<div class="rounded-2xl bg-zinc-900 p-4 text-sm"><b>${esc(m.body)}</b><p class="mt-1 text-xs text-zinc-500">${fmt(m.created_at)}</p></div>`).join('')}</div>`:''}`}
function dutyRow(d){const e=events.find(x=>x.id===d.event_id),label=d.category==='kit_bag'?'Trikottasche':'Kampfgericht';const canClaim=!d.assigned_to||d.assigned_to===user.id;return `<div class="rounded-2xl bg-zinc-900 p-4"><div class="flex items-center justify-between gap-3"><div><b>${label}</b><p class="text-xs text-zinc-400">${e?day(e.starts_at):''} · ${d.status==='confirmed'?'Vom Trainer bestätigt':d.status==='claimed'?'Wartet auf Bestätigung':d.status==='completed'?'Erledigt':'Offen'}</p></div>${canClaim&&d.status==='open'?`<button onclick="claimDuty('${d.id}')" class="${btn} bg-amber-400 text-black">Übernehmen</button>`:''}</div></div>`}
function appointments(){const months={};events.forEach(e=>{const key=new Date(e.starts_at).toLocaleDateString('de-DE',{month:'long',year:'numeric'});(months[key]??=[]).push(e)});return `<h2 class="text-2xl font-black">Termine</h2>${Object.entries(months).map(([m,list])=>`<section class="mt-6"><h3 class="mb-3 text-sm font-black uppercase tracking-widest text-zinc-400">${m}</h3><div class="space-y-3">${list.map(e=>eventCard(e)).join('')}</div></section>`).join('')}`}
function tasks(){const upcoming=duties.filter(d=>{const e=events.find(x=>x.id===d.event_id);return e&&new Date(e.starts_at)>new Date()});const mine=upcoming.filter(d=>d.assigned_to===user.id||!d.assigned_to);return `<h2 class="text-2xl font-black">Aufgaben</h2><p class="mt-1 text-sm text-zinc-400">Kampfgericht und Trikottasche werden getrennt gezählt. Erledigt erst nach Trainer-Bestätigung.</p><div class="mt-5 space-y-2">${mine.length?mine.map(dutyRow).join(''):'<div class="rounded-2xl bg-zinc-900 p-5 text-zinc-400">Aktuell keine offene Aufgabe.</div>'}</div>`}
function statsView(){const players=roster.filter(r=>r.role==='player'&&r.profile_id);if(boxscoreEvent){const game=events.find(e=>e.id===boxscoreEvent);return `<div class="flex items-center justify-between"><h2 class="text-2xl font-black">Boxscore</h2><button onclick="boxscoreEvent=null;render()" class="text-sm text-zinc-400">Zurück</button></div><p class="mt-1 text-zinc-400">${esc(game?.opponent||'Spiel')}</p><form id="statsForm" class="mt-5 overflow-hidden rounded-3xl bg-zinc-900"><div class="grid grid-cols-[1fr_45px_45px_45px_45px] gap-1 border-b border-zinc-800 p-3 text-center text-xs font-black text-zinc-400"><span class="text-left">Spieler</span><span>2PM</span><span>3PM</span><span>FTM</span><span>PF</span></div>${players.map(p=>{const s=stats.find(x=>x.event_id===boxscoreEvent&&x.user_id===p.profile_id)||{};return `<div class="statRow grid grid-cols-[1fr_45px_45px_45px_45px] items-center gap-1 border-b border-zinc-800 p-3" data-user="${p.profile_id}"><b class="text-sm">${esc(p.full_name)}</b>${['two_pm','three_pm','ftm','pf'].map(k=>`<input type="number" min="0" name="${k}" value="${s[k]??0}" class="w-full rounded-lg bg-zinc-800 p-2 text-center">`).join('')}</div>`}).join('')}<button class="${btn} m-4 w-[calc(100%-2rem)] bg-amber-400 text-black">Boxscore speichern</button></form>`}const total={};stats.forEach(s=>{const t=total[s.user_id]??={gp:new Set(),two_pm:0,three_pm:0,ftm:0,pf:0,pts:0};t.gp.add(s.event_id);t.two_pm+=s.two_pm;t.three_pm+=s.three_pm;t.ftm+=s.ftm;t.pf+=s.pf;t.pts+=s.points});const completed=events.filter(e=>e.type==='game'&&results[e.id]);return `<h2 class="text-2xl font-black">Saisonstatistik</h2><p class="mt-1 text-sm text-zinc-400">Nur Trainer sehen diese Ansicht.</p><section class="mt-5 overflow-x-auto rounded-3xl bg-zinc-900"><table class="w-full text-sm"><thead class="text-left text-xs text-zinc-400"><tr><th class="p-3">Spieler</th><th>Sp.</th><th>2PM</th><th>3PM</th><th>FTM</th><th>PF</th><th>PTS</th><th>PPS</th></tr></thead><tbody>$ function appointments(){if(gameDetailEvent)return gameDetail();const games=events.filter(e=>e.type==='game'),months=[...new Set(games.map(e=>e.starts_at.slice(0,7)))],next=new Date(Date.now()+30*864e5),visible=games.filter(e=>scheduleFilter==='all'||(scheduleFilter==='next'?new Date(e.starts_at)<=next:e.starts_at.startsWith(scheduleFilter))),filters=[['all','Alle'],['next','Nächste 30 Tage']].concat(months.map(m=>[m,new Intl.DateTimeFormat('de-DE',{month:'short',year:'numeric'}).format(new Date(m+'-01T12:00:00'))])),filterHtml=filters.map(x=>'<button onclick="setScheduleFilter(\''+x[0]+'\')" class="'+btn+' shrink-0 '+(scheduleFilter===x[0]?'bg-amber-400 text-black':'bg-zinc-800 text-zinc-300')+'">'+x[1]+'</button>').join(''),cards=visible.map(e=>'<button onclick="openGame(\''+e.id+'\')" class="block w-full rounded-3xl bg-zinc-900 p-5 text-left"><b class="text-xs text-amber-400">'+(e.home?'HEIMSPIEL':'AUSWÄRTSSPIEL')+'</b><h3 class="mt-1 text-xl font-black">'+(e.home?'vs ':'@ ')+esc(e.opponent)+'</h3><p class="mt-1 text-sm text-zinc-400">'+day(e.starts_at)+' · '+new Date(e.starts_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</p><span class="mt-4 inline-block text-sm font-bold text-amber-400">Spiel ansehen →</span></button>').join('');return '<h2 class="text-2xl font-black">Spiele</h2><p class="mt-1 text-sm text-zinc-400">Spiel öffnen, Rückmeldung geben und Aufgaben übernehmen.</p><div class="mt-4 flex gap-2 overflow-x-auto pb-2">'+filterHtml+'</div><div class="mt-4 space-y-3">'+(cards||'<p class="rounded-2xl bg-zinc-900 p-4 text-zinc-400">Keine Spiele in diesem Zeitraum.</p>')+'</div>'}
function trainingView(){const cards=events.filter(e=>e.type==='training').map(e=>'<div class="rounded-3xl bg-zinc-900 p-5"><b class="text-xs text-amber-400">TRAINING</b><h3 class="mt-1 text-xl font-black">'+day(e.starts_at)+' · 18:45</h3><p class="mt-1 text-sm text-zinc-400">Georgii-Halle, Leonberg</p></div>').join('');return '<h2 class="text-2xl font-black">Training</h2><div class="mt-5 space-y-3">'+cards+'</div>'}
function kaderView(){const rows=roster.map(p=>'<div class="flex justify-between rounded-2xl bg-zinc-900 p-4"><b>'+esc(p.full_name)+'</b><span class="text-sm '+(p.role==='coach'?'text-amber-400':'text-zinc-400')+'">'+(p.role==='coach'?'Trainer':'Spieler')+'</span></div>').join('');return '<h2 class="text-2xl font-black">U18-Kader</h2><p class="mt-1 text-sm text-zinc-400">12 Spieler · 2 Trainer</p><div class="mt-5 space-y-2">'+rows+'</div>'}
function nav(){const coach=isCoach()?'<button onclick="tab=\'stats\';render()" class="'+btn+' '+(tab==='stats'?'bg-amber-400 text-black':'text-zinc-400')+'">Stats</button><button onclick="tab=\'admin\';render()" class="'+btn+' '+(tab==='admin'?'bg-amber-400 text-black':'text-zinc-400')+'">Trainer</button>':'';return '<nav class="fixed inset-x-0 bottom-0 z-10 border-t border-zinc-800 bg-zinc-950/95"><div class="mx-auto flex max-w-4xl justify-around gap-1 overflow-x-auto p-2"><button onclick="tab=\'home\';render()" class="'+btn+' '+(tab==='home'?'bg-amber-400 text-black':'text-zinc-400')+'">Home</button><button onclick="tab=\'termine\';render()" class="'+btn+' '+(tab==='termine'?'bg-amber-400 text-black':'text-zinc-400')+'">Spiele</button><button onclick="tab=\'training\';render()" class="'+btn+' '+(tab==='training'?'bg-amber-400 text-black':'text-zinc-400')+'">Training</button><button onclick="tab=\'kader\';render()" class="'+btn+' '+(tab==='kader'?'bg-amber-400 text-black':'text-zinc-400')+'">Kader</button>'+coach+'</div></nav>'}
function render(){if(!role)return;const body=tab==='termine'?appointments():tab==='training'?trainingView():tab==='kader'?kaderView():tab==='stats'?statsView():tab==='admin'?admin():home();app.innerHTML=header()+'<section>'+body+'</section>'+nav();document.querySelector('#messageForm')?.addEventListener('submit',sendMessage);document.querySelectorAll('.resultForm').forEach(f=>f.addEventListener('submit',saveResult));document.querySelector('#statsForm')?.addEventListener('submit',saveStats)}
async function answer(id,s){const reason=s==='no'?prompt('Absage-Grund (optional):')||null:null;const {error}=await db.from('attendance').upsert({event_id:id,user_id:user.id,status:s,absence_reason:reason},{onConflict:'event_id,user_id'});if(error)alert(error.message);else load()}
async function claimDuty(id){const {error}=await db.from('duty_assignments').update({assigned_to:user.id,status:'claimed'}).eq('id',id);if(error)alert(error.message);else load()}
async function confirmDuty(id){const {error}=await db.from('duty_assignments').update({status:'completed',confirmed_by:user.id,confirmed_at:new Date().toISOString(),completed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}
async function sendMessage(e){e.preventDefault();const body=new FormData(e.target).get('body').trim();const {error}=await db.from('messages').insert({season_id:SEASON,author_id:user.id,body});if(error)alert(error.message);else e.target.reset()}
async function saveResult(e){e.preventDefault();const f=e.currentTarget,d=new FormData(f);const {error}=await db.from('game_results').upsert({event_id:f.dataset.event,team_score:+d.get('team'),opponent_score:+d.get('opp'),entered_by:user.id},{onConflict:'event_id'});if(error)alert(error.message);else load()}
async function saveStats(e){e.preventDefault();const rows=[...document.querySelectorAll('.statRow')].map(r=>({event_id:boxscoreEvent,user_id:r.dataset.user,two_pm:+r.querySelector('[name="two_pm"]').value||0,three_pm:+r.querySelector('[name="three_pm"]').value||0,ftm:+r.querySelector('[name="ftm"]').value||0,pf:+r.querySelector('[name="pf"]').value||0}));const {error}=await db.from('player_game_stats').upsert(rows,{onConflict:'event_id,user_id'});if(error)alert(error.message);else load()}
async function seedTeamData(auto=false){if(!isCoach())return;const ok=auto||confirm('Die festen U18-Startdaten werden jetzt in Firestore eingespielt. Bereits vorhandene Startdaten werden nur aktualisiert. Fortfahren?');if(!ok)return;const b=firestore.batch(),root=firestore;const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');TEAM_SEED.players.forEach(name=>b.set(root.collection('roster_entries').doc(slug(name)),{season_id:SEASON,full_name:name,role:'player',active:true,profile_id:null},{merge:true}));TEAM_SEED.coaches.forEach(name=>b.set(root.collection('roster_entries').doc(slug(name)),{season_id:SEASON,full_name:name,role:'coach',active:true,profile_id:name==='Berk-Can Celebi'?user.id:null},{merge:true}));TEAM_SEED.games.forEach((g,i)=>{const id=`game-${String(i+1).padStart(2,'0')}`,starts=`${g[0]}T14:00:00`;b.set(root.collection('events').doc(id),{season_id:SEASON,type:'game',starts_at:starts,meeting_at:starts,opponent:g[1],location:g[2],home:g[3]},{merge:true});b.set(root.collection('duty_assignments').doc(`${id}_kit_bag`),{event_id:id,category:'kit_bag',status:'open',assigned_to:null},{merge:true});b.set(root.collection('duty_assignments').doc(`${id}_scoretable`),{event_id:id,category:'scoretable',status:'open',assigned_to:null},{merge:true})});TEAM_SEED.trainings.forEach((date,i)=>b.set(root.collection('events').doc(`training-${String(i+1).padStart(2,'0')}`),{season_id:SEASON,type:'training',starts_at:`${date}T18:45:00`,location:'Georgii-Halle, Leonberg',home:true},{merge:true}));b.set(root.collection('messages').doc('season-start'),{season_id:SEASON,author_id:user.id,body:'Willkommen in der neuen Saison! Erstes Training am 15.09. um 18:45 Uhr.',created_at:'2026-09-01T12:00:00'});b.set(root.collection('messages').doc('first-game'),{season_id:SEASON,author_id:user.id,body:'Bitte alle Zusagen für das erste Spiel gegen ESV Rot-Weiss eintragen!',created_at:'2026-09-20T12:00:00'});try{await b.commit();if(!auto)alert('Fertig: Kader, 12 Spiele, 29 Trainings, 24 Aufgaben und Startnachrichten sind in Firestore.');load()}catch(error){alert('Der Import wurde von Firestore abgelehnt: '+error.message)}}
async function signout(){unsubscribe.forEach(x=>x());await firebaseAuth.signOut();location.reload()}
firebaseAuth.onAuthStateChanged(u=>{user=u?{id:u.uid,email:u.email,displayName:u.displayName}:null;if(u)load();else login()});
</script>
