async function deletePushJob(id){if(!confirm('Diese Mitteilung wirklich löschen? Geplante Mitteilungen werden dadurch nicht versendet.'))return;try{const token=await auth.currentUser.getIdToken(),response=await fetch(PUSH_SERVICE_URL+'/jobs/'+encodeURIComponent(id)+'?team='+encodeURIComponent(activeTeam),{method:'DELETE',headers:{authorization:'Bearer '+token}});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||'Mitteilung konnte nicht gelöscht werden.')}await loadPushJobs();render()}catch(error){alert(error.message||'Mitteilung konnte nicht gelöscht werden.')}}
async function sendPushJob(event){event.preventDefault();const form=event.currentTarget,body=new FormData(form),recipients=[...form.querySelectorAll('.push-recipient:checked')].map(x=>x.value);if(!recipients.length)return alert('Bitte mindestens einen Empfänger auswählen.');const eventId=body.get('event'),selected=events.find(e=>e.id===eventId),scheduled=body.get('scheduled'),job={team_id:activeTeam,title:String(body.get('title')).trim(),body:String(body.get('body')).trim(),recipients,scheduled_at:scheduled?new Date(scheduled).toISOString():new Date().toISOString(),url:selected?`${location.origin}${location.pathname}?event=${encodeURIComponent(selected.id)}`:`${location.origin}${location.pathname}`};try{const token=await auth.currentUser.getIdToken(),response=await fetch(PUSH_SERVICE_URL+'/jobs',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({job})});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||'Versand wurde abgelehnt.')}form.reset();await loadPushJobs();render()}catch(error){alert(error.message||'Mitteilung konnte nicht gespeichert werden.')}}

async function resolveMyTeams(){
  if(me.email==='berk@teamplaner.invalid'){myTeams=Object.keys(TEAMS).map(id=>({team_id:id,role:'club_admin'}));return}
  const snap=await store.collection('team_memberships').where('user_id','==',me.uid).get();
  myTeams=snap.docs.map(d=>d.data()).filter(m=>TEAMS[m.team_id]);
}
function pickInitialTeam(){
  const saved=localStorage.getItem('teamplaner-active-team');
  if(saved&&myTeams.some(m=>m.team_id===saved))return saved;
  return myTeams[0]?.team_id||null;
}
function switchTeam(teamId){if(!myTeams.some(m=>m.team_id===teamId))return;activeTeam=teamId;localStorage.setItem('teamplaner-active-team',teamId);page='home';detail=null;boxscoreEvent=null;load().catch(loadError)}

async function load(){
  if(!activeTeam)return render();
  const md=await store.collection('team_memberships').doc(me.uid+'_'+activeTeam).get();
  membership=md.exists?md.data():(me.email==='berk@teamplaner.invalid'?{role:'club_admin',full_name:'Berk-Can Çelebi'}:null);
  const sources=['events','roster_entries','attendance','duty_assignments','game_results','messages'].map(c=>store.collection(c).where('season_id','==',activeTeam).get());
  sources.splice(4,0,(coach()?store.collection('player_game_stats').where('season_id','==',activeTeam):store.collection('player_game_stats').where('season_id','==',activeTeam).where('user_id','==',me.uid)).get());
  const [sets,historySet]=await Promise.all([Promise.all(sources),coach()?store.collection('duty_history').where('season_id','==',activeTeam).get():Promise.resolve({docs:[]})]);
  const vals=sets.map(s=>s.docs.map(d=>({...d.data(),id:d.id})));
  [events,roster,responses,duties,stats,results,messages]=vals;
  dutyHistory=historySet.docs.map(d=>({...d.data(),id:d.id}));
  messages=messages.sort((a,b)=>timestamp(b.created_at)-timestamp(a.created_at));
  const pd=await store.collection('player_profiles').doc(me.uid).get();
  profile=pd.exists?pd.data():{};
  render();startLiveUpdates()
}
let liveTeam=null;
function startLiveUpdates(){if(!me||!activeTeam)return;if(liveTeam===activeTeam&&liveUnsub.length)return;liveUnsub.forEach(x=>x());liveTeam=activeTeam;liveUnsub=['events','attendance','duty_assignments','game_results','messages',...(coach()?['duty_history']:[])].map(collection=>store.collection(collection).where('season_id','==',activeTeam).onSnapshot(()=>{clearTimeout(liveRefreshTimer);liveRefreshTimer=setTimeout(()=>{if(me&&activeTeam)load().catch(loadError)},400)},()=>{}))}
async function signout(){clearTimeout(liveRefreshTimer);liveUnsub.forEach(x=>x());liveUnsub=[];try{await auth.signOut()}catch(error){console.warn('Abmeldung konnte nicht vollständig an Firebase gemeldet werden.',error)}finally{me=null;myTeams=[];activeTeam=null;membership=null;profile={};detail=null;page='home';login()}}

function loadError(error){console.error(error);app.innerHTML=`<section class="mx-auto mt-20 max-w-md ${card} text-center"><div class="text-4xl">⚠️</div><h1 class="mt-3 text-xl font-black">Daten konnten nicht geladen werden</h1><p class="mt-2 text-sm text-zinc-400">Bitte aktualisiere die Firestore-Regeln im Firebase-Projekt und lade die Seite danach erneut.</p><p class="mt-3 rounded-xl bg-zinc-800 p-3 text-left text-xs text-zinc-400">${esc(error?.message||'Unbekannter Fehler')}</p><button onclick="location.reload()" class="${button} mt-4 bg-sky-400 text-zinc-950">Erneut versuchen</button></section>`}
auth.onAuthStateChanged(async u=>{
  me=u?{uid:u.uid,email:u.email}:null;

function eventItem(e,compact=false){const game=e.type==='game', yes=responses.filter(r=>r.event_id===e.id&&r.status==='yes').length, roster_size=people().length||1, timeLabel=e.time_tbd?'Zeit folgt':time(e.starts_at);return `<button onclick="openEvent('${e.id}')" class="${card} tap block w-full text-left ${compact?'p-4':''}"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><p class="text-xs font-black tracking-widest ${game?'text-sky-300':'text-violet-300'}">${game?(e.home?'HEIMSPIEL':'AUSWÄRTSSPIEL'):'TRAINING'} · KW ${week(e.starts_at)}</p><h3 class="mt-1 truncate text-lg font-black">${game?(e.home?'vs ':'@ ')+esc(e.opponent):'Training'}</h3><p class="mt-1 text-sm text-zinc-400">${dfmt(e.starts_at)} · ${timeLabel}</p></div>${game?responseBadge(response(e.id)?.status):''}</div><p class="mt-3 truncate text-sm text-zinc-300">📍 ${esc(e.location)}</p>${game?`<div class="mt-3 flex items-center justify-between text-xs"><span class="font-bold text-sky-200">${yes}/${roster_size} zugesagt</span><span class="text-zinc-400">Spiel öffnen →</span></div>`:'<p class="mt-3 text-xs font-bold text-violet-300">Training öffnen →</p>'}</button>`}

  const own=statTotal(me.uid),rate=own.fta?Math.round(own.ft/own.fta*100):0;
  const playerRows=people().map(p=>({p,t:statTotal(p.profile_id)})).sort((a,b)=>b.t.points-a.t.points);
  const ownHtml=`<section class="${card} mt-5"><p class="text-xs font-black tracking-widest text-sky-300">DEINE WERTE</p><div class="mt-3 grid grid-cols-2 gap-3 text-center sm:grid-cols-4"><div><b class="block text-xl">${own.points}</b><span class="text-zinc-400">PTS</span></div><div><b class="block text-xl">${own.two}</b><span class="text-zinc-400">2PM</span></div><div><b class="block text-xl">${own.three}</b><span class="text-zinc-400">3PM</span></div><div><b class="block text-xl">${own.ft}/${own.fta}</b><span class="text-zinc-400">FT · ${rate}%</span></div></div></section>`;
  if(!coach())return `<h2 class="text-2xl font-black">Saisonstatistik</h2><p class="mt-1 text-sm text-zinc-400">Deine Werte. Team-Ranglisten bleiben geschützt.</p>${ownHtml}`;
  const tableRows=playerRows.map(({p,t})=>`<tr class="border-t border-white/[.06]"><td class="p-3 font-bold">${esc(p.full_name)}</td><td>${t.games}</td><td>${t.points}</td><td>${t.two}</td><td>${t.three}</td><td>${t.ft}/${t.fta}</td><td>${t.fta?Math.round(t.ft/t.fta*100)+'%':'–'}</td><td>${t.pf}</td><td class="${t.plusMinus>0?'text-emerald-300':t.plusMinus<0?'text-rose-300':''}">${t.plusMinus>0?'+':''}${t.plusMinus}</td></tr>`).join('');
  const gameCards=events.filter(e=>e.type==='game').map(e=>{const r=results.find(x=>x.event_id===e.id),score=r?`${r.team_score} : ${r.opponent_score}`:'Ergebnis eintragen';return `<button onclick="openBoxscore('${e.id}')" class="${card} tap flex w-full items-center justify-between gap-2 text-left"><span class="min-w-0"><b class="block truncate">${e.home?'vs ':'@ '}${esc(e.opponent)}</b><span class="mt-1 block text-xs text-zinc-400">${dfmt(e.starts_at)} · ${score}</span></span><span class="shrink-0 text-sky-300">Boxscore ›</span></button>`}).join('');
  return `<h2 class="text-2xl font-black">Saisonstatistik</h2><p class="mt-1 text-sm text-zinc-400">Deine Werte und der Überblick über das Team.</p>${ownHtml}<section class="${card} mt-4 overflow-x-auto p-0"><table class="min-w-[720px] w-full text-sm"><thead class="text-left text-xs text-zinc-400"><tr><th class="p-3">Spieler</th><th>Sp.</th><th>PTS</th><th>2PM</th><th>3PM</th><th>FT</th><th>FT%</th><th>PF</th><th>+ / −</th></tr></thead><tbody>${tableRows}</tbody></table></section><section class="mt-5"><h3 class="mb-3 font-black">Ergebnisse & Boxscore</h3><div class="space-y-2">${gameCards}</div></section>`;
}
function dutyActivity(){const label={scorer:'Bogen/iPad',shotclock:'24 Sekunden',timekeeper:'Anzeigetafel',kit_bag:'Trikottasche'},action={claimed:'eingetragen',withdrawn:'ausgetragen',assigned:'zugeteilt'},items=[...dutyHistory].sort((a,b)=>timestamp(b.occurred_at)-timestamp(a.occurred_at)).slice(0,40);return `<div class="mt-3 space-y-2">${items.length?items.map(h=>{const e=events.find(x=>x.id===h.event_id),gameLabel=e?(e.home?'vs ':'@ ')+e.opponent:'Spiel',color=h.action==='withdrawn'?'text-zinc-400':'text-sky-300';return `<div class="rounded-xl bg-zinc-800/70 p-3 text-sm"><b>${esc(h.player_name||'Teammitglied')}</b> <span class="${color}">${action[h.action]||h.action}</span><span class="block truncate text-xs text-zinc-400">${esc(label[h.category]||h.category)} · ${esc(gameLabel)} · ${dateTime(h.occurred_at)}</span></div>`}).join(''):'<p class="text-sm text-zinc-400">Noch keine Eintragungen.</p>'}</div><button onclick="clearTestDuties()" class="mt-3 text-xs font-bold text-zinc-500 underline">Tests zurücksetzen</button>`}
function coachRsvpOverview(){const next=upcoming().filter(e=>e.type==='game'||e.type==='training').slice(0,5),roster_size=people().length||1;return `<div class="mt-3 space-y-2">${next.map(e=>{const answered=responses.filter(r=>r.event_id===e.id).length,yes=responses.filter(r=>r.event_id===e.id&&r.status==='yes').length;return `<button onclick="openEvent('${e.id}')" class="flex w-full items-center justify-between gap-2 rounded-xl bg-zinc-800/70 p-3 text-left"><span class="min-w-0"><b class="block truncate text-sm">${e.type==='game'?(e.home?'vs ':'@ ')+esc(e.opponent):'Training'}</b><span class="text-xs text-zinc-400">${dfmt(e.starts_at)} · ${time(e.starts_at)}</span></span><span class="shrink-0 text-right text-xs text-sky-200"><b>${answered}/${roster_size}</b><br>${yes} Zusagen</span></button>`}).join('')||'<p class="text-sm text-zinc-400">Keine kommenden Termine.</p>'}</div>`}
function accordion(title,summary,body,open=false){return `<details class="${card} mt-4"${open?' open':''}><summary class="cursor-pointer font-black">${title}<span class="mt-1 block text-xs font-normal text-zinc-400">${summary}</span></summary><div class="mt-4">${body}</div></details>`}
function coachView(){
  const openDuties=duties.filter(d=>!d.assigned_to).length, claimed=duties.filter(d=>d.status==='claimed'), confirmItems=claimed.slice(0,5);
  return `<h2 class="text-2xl font-black">Trainerbereich · ${esc(team().label)}</h2>`
  +accordion('Rückmeldungen','Wer hat für die nächsten Termine schon geantwortet.',coachRsvpOverview(),true)
  +accordion('Nach Einsatz bestätigen · '+confirmItems.length,'Eingetragene Schichten erst nach dem Einsatz bestätigen. Dann zählen sie zur Statistik.',confirmItems.map(d=>{const e=events.find(x=>x.id===d.event_id);return `<button onclick="openEvent('${d.event_id}')" class="flex w-full items-center justify-between gap-2 rounded-xl bg-zinc-800/70 p-3 text-left"><span class="min-w-0"><b class="block truncate text-sm">${esc(d.assigned_name||'Teammitglied')}</b><span class="truncate text-xs text-zinc-400">${e?.team?esc(e.team)+' · ':''}${e?.opponent?esc(e.opponent):''}</span></span><span class="shrink-0 text-xs text-emerald-300">Schicht öffnen ›</span></button>`}).join('')||'<p class="text-sm text-zinc-400">Keine Schichten warten auf Bestätigung.</p>',confirmItems.length>0)
  +accordion('Push-Benachrichtigung','Systemmeldung an alle oder ausgewählte Spieler von '+esc(team().label)+' senden.',notificationCenter())
  +accordion('Nachricht ans Team','Kurznachricht, die in der App unter „Team-Updates“ erscheint.',`<form id="message" class="flex w-full min-w-0 flex-col gap-2 sm:flex-row"><input required name="body" class="min-w-0 flex-1 rounded-xl bg-zinc-800 p-3" placeholder="z. B. Treffzeit wird noch bekannt gegeben"><button class="${button} bg-sky-400 text-zinc-950">Senden</button></form>`)
  +accordion('Zugang anlegen','Neue Zugang-ID und Zugangscode für '+esc(team().label)+' vergeben.',`<form id="provision" class="grid gap-2 sm:grid-cols-2"><input required name="name" class="rounded-xl bg-zinc-800 p-3 sm:col-span-2" placeholder="Vollständiger Name"><select name="role" class="rounded-xl bg-zinc-800 p-3"><option value="player">Spieler</option><option value="coach">Trainer</option></select><input required name="id" autocapitalize="none" pattern="[a-z0-9._-]+" class="rounded-xl bg-zinc-800 p-3" placeholder="Zugang-ID, z. B. tobias"><input required name="code" minlength="8" type="password" class="rounded-xl bg-zinc-800 p-3 sm:col-span-2" placeholder="Zugangscode (mind. 8 Zeichen)"><button class="${button} bg-sky-400 text-zinc-950 sm:col-span-2">Zugang sicher anlegen</button><p id="provisionHint" class="text-xs text-zinc-400 sm:col-span-2"></p></form>`)
  +(admin()?accordion('Anschreiben-Termine','Finale Hallenliste für '+esc(team().label)+' übernehmen. Bereits erfasste Trikottaschen bleiben unverändert.',`<p class="text-sm text-zinc-400">${team().scoreTable.length} Einsätze in der Hallenliste.</p><button onclick="syncScoretableSchedule()" class="${button} mt-3 bg-sky-400 text-zinc-950">Hallenliste übernehmen</button>`):'')
  +accordion('Aufgaben-Protokoll','Eintragungen und Austragungen, neueste zuerst.',dutyActivity())
  +`<a target="_blank" rel="noopener" href="https://www.basketball-bund.net/presseExport.do?reqCode=showLigen&viewDescr=sport.dbb.liga.LigaViewPublic/index.jsp_&viewClass=sport.dbb.liga.LigaViewPublic" class="tap ${card} mt-4 flex items-center justify-between gap-3 border border-sky-400/20 bg-gradient-to-br from-sky-950/60 via-zinc-900 to-zinc-900"><div class="min-w-0"><p class="text-xs font-black tracking-widest text-sky-300">DBB · TRAINER-EXPORT</p><b class="mt-1 block">Ergebnisse & Statistiken</b><span class="text-sm text-zinc-400">Ligaexport öffnen und Textdatei herunterladen</span></div><span class="shrink-0 text-xl text-sky-300">↗</span></a>`;
}
async function rsvp(eventId,status){let reason=null;if(status==='no')reason=prompt('Absagegrund (optional)')||'';await store.collection('attendance').doc(eventId+'_'+me.uid).set({event_id:eventId,user_id:me.uid,season_id:activeTeam,status,absence_reason:reason,updated_at:new Date().toISOString()},{merge:true});await load()}
async function claim(id){const target=duties.find(d=>d.id===id),already=target&&target.category!=='kit_bag'&&duties.find(d=>d.event_id===target.event_id&&d.category!=='kit_bag'&&d.assigned_to===me.uid&&d.id!==id);if(already)return alert('Du hast für diesen Einsatz bereits eine Kampfgericht-Rolle. Die Trikottasche kannst du zusätzlich übernehmen.');const ref=store.collection('duty_assignments').doc(id),historyRef=store.collection('duty_history').doc(),claimedAt=new Date().toISOString(),name=currentName();try{await store.runTransaction(async tx=>{const latest=await tx.get(ref);if(!latest.exists)throw Error('Diese Aufgabe existiert nicht mehr.');if(latest.data().assigned_to)throw Error('Diese Schicht wurde gerade von einem anderen Spieler übernommen.');tx.update(ref,{assigned_to:me.uid,assigned_name:name,status:'claimed',claimed_at:claimedAt});tx.set(historyRef,{event_id:latest.data().event_id,duty_id:id,category:latest.data().category,season_id:activeTeam,player_id:me.uid,player_name:name,action:'claimed',occurred_at:claimedAt})});await load()}catch(error){await load();alert(error.message||'Die Schicht konnte nicht übernommen werden.')}}
async function confirmDuty(id){const duty=duties.find(d=>d.id===id),event=events.find(e=>e.id===duty?.event_id);if(!event||Date.now()<new Date(event.starts_at).getTime()+3*60*60*1000)return alert('Die Bestätigung ist erst nach dem Spiel möglich.');await store.collection('duty_assignments').doc(id).update({status:'completed',confirmed_by:me.uid,confirmed_at:new Date().toISOString()});await load()}
async function withdrawDuty(id){const ref=store.collection('duty_assignments').doc(id),historyRef=store.collection('duty_history').doc(),withdrawnAt=new Date().toISOString();try{await store.runTransaction(async tx=>{const latest=await tx.get(ref);if(!latest.exists||latest.data().assigned_to!==me.uid)throw Error('Diese Schicht ist nicht mehr bei dir eingetragen.');tx.update(ref,{assigned_to:null,assigned_name:null,status:'open',claimed_at:null,withdrawn_at:withdrawnAt});tx.set(historyRef,{event_id:latest.data().event_id,duty_id:id,category:latest.data().category,season_id:activeTeam,player_id:me.uid,player_name:currentName(),action:'withdrawn',occurred_at:withdrawnAt})});await load()}catch(error){await load();alert(error.message||'Das Austragen konnte nicht gespeichert werden.')}}
async function assignDuty(id){const selectable=people().filter(p=>p.profile_id),choices=selectable.map((p,i)=>`${i+1}. ${p.full_name}`).join('\n'),pick=+prompt('Spieler auswählen:\n'+choices),chosen=selectable[pick-1],target=duties.find(d=>d.id===id);if(!pick||!chosen||!target)return;const already=target.category!=='kit_bag'&&duties.find(d=>d.event_id===target.event_id&&d.category!=='kit_bag'&&d.assigned_to===chosen.profile_id&&d.id!==id);if(already)return alert(`${chosen.full_name} hat für dieses Spiel bereits eine Kampfgericht-Rolle.`);const ref=store.collection('duty_assignments').doc(id),historyRef=store.collection('duty_history').doc(),assignedAt=new Date().toISOString();try{await store.runTransaction(async tx=>{const latest=await tx.get(ref);if(!latest.exists||latest.data().assigned_to)throw Error('Diese Schicht wurde inzwischen übernommen.');tx.update(ref,{assigned_to:chosen.profile_id,assigned_name:chosen.full_name,status:'claimed',assigned_by:me.uid,claimed_at:assignedAt});tx.set(historyRef,{event_id:latest.data().event_id,duty_id:id,category:latest.data().category,season_id:activeTeam,player_id:chosen.profile_id,player_name:chosen.full_name,action:'assigned',occurred_at:assignedAt,assigned_by:me.uid})});await load()}catch(error){await load();alert(error.message||'Die Zuteilung konnte nicht gespeichert werden.')}}
async function clearTestDuties(){if(!admin()||!confirm('Alle aktuellen Test-Eintragungen und das Aufgaben-Protokoll löschen? Die offenen Aufgaben bleiben erhalten.'))return;const batch=store.batch();duties.filter(d=>d.assigned_to||d.status!=='open').forEach(d=>batch.update(store.collection('duty_assignments').doc(d.id),{assigned_to:null,assigned_name:null,status:'open',claimed_at:null,withdrawn_at:null,confirmed_by:null,confirmed_at:null}));dutyHistory.forEach(h=>batch.delete(store.collection('duty_history').doc(h.id)));try{await batch.commit();await load();alert('Die Test-Eintragungen wurden gelöscht.')}catch(error){alert('Die Test-Eintragungen konnten nicht gelöscht werden: '+error.message)}}
async function sendMessage(e){e.preventDefault();const body=new FormData(e.target).get('body').trim();if(!body)return;await store.collection('messages').add({season_id:activeTeam,author_id:me.uid,body,created_at:new Date().toISOString()});e.target.reset();await load()}
async function deleteMessage(id){if(!coach()||!confirm('Diese Mitteilung löschen?'))return;await store.collection('messages').doc(id).delete();await load()}
async function deleteAllMessages(){if(!coach()||!messages.length||!confirm('Wirklich alle Team-Updates für '+team().label+' löschen?'))return;const batch=store.batch();messages.forEach(m=>batch.delete(store.collection('messages').doc(m.id)));await batch.commit();await load()}
async function provisionAccess(e){e.preventDefault();if(!coach())return;const form=e.currentTarget,d=new FormData(form),name=String(d.get('name')).trim(),id=String(d.get('id')).trim().toLowerCase(),code=String(d.get('code')),role=String(d.get('role')),hint=document.querySelector('#provisionHint');if(!/^[a-z0-9._-]+$/.test(id))return hint.textContent='Die Zugang-ID darf nur Kleinbuchstaben, Zahlen, Punkt, Unterstrich oder Bindestrich enthalten.';hint.textContent='Zugang wird angelegt …';let provisionApp;try{provisionApp=firebase.app('teamplanner-provision')}catch(_){provisionApp=firebase.initializeApp(FIREBASE,'teamplanner-provision')}try{const created=await provisionApp.auth().createUserWithEmailAndPassword(id+'@teamplaner.invalid',code),newUid=created.user.uid;await store.collection('team_memberships').doc(newUid+'_'+activeTeam).set({user_id:newUid,team_id:activeTeam,season_id:activeTeam,role,full_name:name,active:true,created_by:me.uid,created_at:new Date().toISOString()});const entry=roster.find(x=>x.full_name.toLocaleLowerCase('de-DE')===name.toLocaleLowerCase('de-DE'));if(entry)await store.collection('roster_entries').doc(entry.id).set({profile_id:newUid,role,active:true},{merge:true});await provisionApp.auth().signOut();form.reset();hint.textContent=`Fertig: ${name} kann sich mit ${id} anmelden (Team: ${team().label}).`;await load()}catch(error){try{await provisionApp?.auth().signOut()}catch(_){};hint.textContent=error.code==='auth/email-already-in-use'?'Diese Zugang-ID ist bereits vergeben.':'Zugang konnte nicht angelegt werden: '+error.message}}
function slotStart(date,timeOrNull){return timeOrNull?date+'T'+timeOrNull+':00':date+'T00:00:00'}
async function seed(){
  if(!admin())return;
  const t=team();
  if(!confirm(`Kader, Spielplan und Training für ${t.label} werden geprüft. Bereits erfasste Aufgaben bleiben unverändert. Fortfahren?`))return;
  const batch=store.batch(), prefix=activeTeam+'-';
  t.players.forEach(name=>batch.set(store.collection('roster_entries').doc(prefix+uid(name)),{season_id:activeTeam,full_name:name,role:'player',active:true,profile_id:null,positions:[]},{merge:true}));
  t.coaches.forEach(name=>batch.set(store.collection('roster_entries').doc(prefix+uid(name)),{season_id:activeTeam,full_name:name,role:'coach',active:true,profile_id:name==='Berk-Can Çelebi'?me.uid:null,positions:[]},{merge:true}));
  t.games.forEach((g,i)=>{const [date,opponent,location,home,gameTime,note]=g, id=prefix+'game-'+String(i+1).padStart(2,'0'), timeTbd=!gameTime, start=slotStart(date,gameTime);
    batch.set(store.collection('events').doc(id),{season_id:activeTeam,type:'game',starts_at:start,meeting_at:timeTbd?null:start,time_tbd:timeTbd,opponent,location,home,schedule_note:note||null,schedule_source:t.scheduleSource,schedule_verified_at:'2026-08-08'},{merge:true});
    batch.set(store.collection('duty_assignments').doc(id+'-kit-bag'),{season_id:activeTeam,event_id:id,category:'kit_bag',assigned_to:null,assigned_name:null,status:'open',claimed_at:null,confirmed_at:null},{merge:true});
  });
  t.trainings.forEach((tr,i)=>{const [date,trTime,location]=tr;batch.set(store.collection('events').doc(prefix+'training-'+String(i+1).padStart(2,'0')),{season_id:activeTeam,type:'training',starts_at:slotStart(date,trTime),location,home:true,schedule_source:t.scheduleSource,schedule_verified_at:'2026-08-08'},{merge:true})});
  await batch.commit();await load();
}
async function syncScoretableSchedule(){
  if(!admin())return;
  const t=team(), prefix=activeTeam+'-';
  if(!confirm(`Die bisherigen Anschreiben-Testdaten für ${t.label} werden gelöscht und durch die Termine aus der Hallenliste ersetzt. Trikottaschen bleiben unverändert. Fortfahren?`))return;
  const batch=store.batch(), oldDutyIds=new Set(duties.filter(d=>d.category!=='kit_bag').map(d=>d.id));
  duties.filter(d=>d.category!=='kit_bag').forEach(d=>batch.delete(store.collection('duty_assignments').doc(d.id)));
  events.filter(e=>e.type==='scoretable').forEach(e=>batch.delete(store.collection('events').doc(e.id)));
  dutyHistory.filter(h=>oldDutyIds.has(h.duty_id)||['scorer','shotclock','timekeeper'].includes(h.category)).forEach(h=>batch.delete(store.collection('duty_history').doc(h.id)));
  t.scoreTable.forEach((item,index)=>{
    const [date,clock,homeTeam,opponent,group,needsConfirmation,note]=item, eventId=prefix+'scoretable-'+String(index+1).padStart(2,'0');
    batch.set(store.collection('events').doc(eventId),{season_id:activeTeam,type:'scoretable',starts_at:date+'T'+clock+':00',location:'Sportvereinszentrum, Leonberg',home:true,team:homeTeam,opponent,assignee_group:group,needs_confirmation:needsConfirmation,schedule_note:note||null,schedule_source:t.scheduleSource,schedule_verified_at:'2026-08-08'});
    ['scorer','shotclock','timekeeper'].forEach(category=>batch.set(store.collection('duty_assignments').doc(eventId+'-'+category),{season_id:activeTeam,event_id:eventId,category,assigned_to:null,assigned_name:null,status:'open',claimed_at:null,confirmed_at:null}));
  });
  try{await batch.commit();await load();alert('Die Anschreiben-Termine wurden übernommen.')}catch(error){alert('Die Anschreiben-Termine konnten nicht gespeichert werden: '+error.message)}
}
</script>
