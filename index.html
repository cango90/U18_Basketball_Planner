<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>U18 Basketball · SV Leonberg/Eltingen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.hero{background:radial-gradient(circle at 100% 0,#fbbf24 0,transparent 38%),linear-gradient(135deg,#27272a,#ea580c)}.card{box-shadow:0 12px 34px rgba(0,0,0,.24)}button{transition:.16s transform,opacity}.tap:active{transform:scale(.97)}
  </style>
</head>
<body class="min-h-screen bg-zinc-950 pb-24 text-zinc-100">
  <main id="app" class="mx-auto max-w-3xl p-4"></main>
<script>
const SUPABASE_URL='https://frpdnwdswwlmbuahzncj.supabase.co';
const KEY='sb_publishable_ODb9F_BySijetTIMU3Yqgg_8f2KEZX-';
const SEASON='40599b22-b5ad-4185-9855-bc69735ec5a1';
const db=supabase.createClient(SUPABASE_URL,KEY);
let user,role='player',tab='home',boxscoreEvent=null,events=[],attendance={},duties=[],messages=[],results={},stats=[],roster=[],requests=[];
const app=document.querySelector('#app');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const isCoach=()=>role==='coach'||role==='club_admin';
const fmt=x=>new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x));
const day=x=>new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long'}).format(new Date(x));
const btn='tap rounded-xl px-3 py-2 text-sm font-black';
const status=s=>s==='yes'?'<span class="text-emerald-400">● Zugesagt</span>':s==='no'?'<span class="text-red-400">● Abgesagt</span>':s==='maybe'?'<span class="text-amber-300">● Vielleicht</span>':'<span class="text-amber-300">● Antwort offen</span>';
const nameFor=id=>roster.find(x=>x.profile_id===id)?.full_name||'Teammitglied';

function login(){
 app.innerHTML=`<section class="mx-auto mt-16 max-w-md text-center"><div class="text-5xl">🦁🏀</div><p class="mt-5 text-xs font-black tracking-[.2em] text-amber-400">SV LEONBERG/ELTINGEN</p><h1 class="mt-1 text-3xl font-black">Basketball Team Planner</h1><p class="mt-2 text-zinc-400">Ein Login für Spieler und Trainer.</p><form id="loginForm" class="card mt-8 rounded-3xl bg-zinc-900 p-5 text-left"><label class="text-sm font-bold">E-Mail-Adresse</label><input name="email" required type="email" autocomplete="email" class="mt-2 w-full rounded-xl bg-zinc-800 p-3 outline-none ring-amber-400 focus:ring-2" placeholder="name@email.de"><button class="${btn} mt-4 w-full bg-amber-400 text-black">Login-Link senden</button><p id="hint" class="mt-3 text-center text-xs text-zinc-400">Kein Passwort. Kein PIN. Link in der E-Mail öffnen.</p></form></section>`;
 document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.target).get('email').trim();const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});document.querySelector('#hint').textContent=error?error.message:'Gesendet – E-Mail öffnen und Link anklicken.'};
}

async function load(){
 const membership=await db.from('team_memberships').select('role').eq('season_id',SEASON).eq('user_id',user.id).maybeSingle();role=membership.data?.role||null;
 if(!role){render();return}
 const [ev,at,du,msg,re,ro,st]=await Promise.all([
  db.from('events').select('*').eq('season_id',SEASON).order('starts_at'),
  db.from('attendance').select('*'),db.from('duty_assignments').select('*'),
  db.from('messages').select('*').eq('season_id',SEASON).order('created_at',{ascending:false}).limit(20),
  db.from('game_results').select('*'),db.from('roster_entries').select('*').eq('season_id',SEASON).order('full_name'),
  isCoach()?db.from('player_game_stats').select('*'):Promise.resolve({data:[]})
 ]);
 events=ev.data||[]; attendance={};(at.data||[]).forEach(x=>{(attendance[x.event_id]??={})[x.user_id]=x});duties=du.data||[];messages=msg.data||[];results={};(re.data||[]).forEach(x=>results[x.event_id]=x);roster=ro.data||[];stats=st.data||[];
 if(isCoach()){const rq=await db.from('access_requests').select('*,profiles(full_name)').eq('season_id',SEASON).eq('status','pending');requests=rq.data||[]}
 render();subscribe();
}
function subscribe(){db.removeAllChannels();db.channel('team-live').on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'season_id=eq.'+SEASON},load).on('postgres_changes',{event:'*',schema:'public',table:'attendance'},load).on('postgres_changes',{event:'*',schema:'public',table:'duty_assignments'},load).on('postgres_changes',{event:'*',schema:'public',table:'messages'},load).on('postgres_changes',{event:'*',schema:'public',table:'game_results'},load).on('postgres_changes',{event:'*',schema:'public',table:'access_requests'},load).subscribe()}
function nav(){return `<nav class="fixed inset-x-0 bottom-0 z-10 border-t border-zinc-800 bg-zinc-950/95 backdrop-blur"><div class="mx-auto flex max-w-3xl justify-around p-2">${[['home','Home'],['termine','Termine'],['aufgaben','Aufgaben'],...(isCoach()?[['stats','Stats'],['admin','Trainer']]:[])].map(([id,label])=>`<button onclick="tab='${id}';render()" class="${btn} ${tab===id?'bg-amber-400 text-black':'text-zinc-400'}">${label}</button>`).join('')}</div></nav>`}
function header(){return `<header class="mb-5 flex items-center justify-between"><div><p class="text-xs font-black tracking-widest text-amber-400">SV LEONBERG/ELTINGEN</p><h1 class="text-xl font-black">Basketball U18</h1></div><button onclick="signout()" class="text-sm font-bold text-zinc-400">Abmelden</button></header>`}
function eventCard(e,hero=false){const a=attendance[e.id]||{}, yes=Object.values(a).filter(x=>x.status==='yes').length, mine=a[user.id]?.status,game=e.type==='game',result=results[e.id];return `<article class="${hero?'hero text-white':'bg-zinc-900'} card rounded-3xl p-5"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-widest ${hero?'text-amber-100':'text-amber-400'}">${game?(e.home?'🏀 Heimspiel':'🏀 Auswärtsspiel'):'🏀 Training'}</p><h2 class="mt-1 text-xl font-black">${game?(e.home?'vs ':'@ ')+esc(e.opponent):'Training'}</h2><p class="mt-1 text-sm opacity-80">${day(e.starts_at)} · ${new Date(e.starts_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</p></div>${status(mine)}</div><div class="mt-4 grid gap-2 text-sm sm:grid-cols-2"><span>📍 ${esc(e.location)}</span>${game?`<span>🕒 Treffzeit: ${e.meeting_at?new Date(e.meeting_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'folgt'}</span>`:''}</div>${result?`<p class="mt-4 rounded-xl bg-black/15 p-3 text-center text-lg font-black">Ergebnis: ${result.team_score} : ${result.opponent_score}</p>`:`<div class="mt-4"><div class="flex justify-between text-sm"><b>${yes} / 12 zugesagt</b><span>${yes<10?`Noch ${10-yes} bis Mindestkader`:'Kader steht'}</span></div><div class="mt-2 h-2 rounded-full bg-black/20"><div class="h-2 rounded-full bg-emerald-400" style="width:${Math.min(100,yes/12*100)}%"></div></div></div>`}<div class="mt-4 grid grid-cols-3 gap-2"><button onclick="answer('${e.id}','yes')" class="${btn} bg-emerald-500 text-white">Zusage</button><button onclick="answer('${e.id}','maybe')" class="${btn} bg-amber-300 text-black">Vielleicht</button><button onclick="answer('${e.id}','no')" class="${btn} bg-red-500 text-white">Absage</button></div></article>`}
function home(){const up=events.filter(e=>new Date(e.starts_at)>new Date()),game=up.find(e=>e.type==='game'),training=up.find(e=>e.type==='training'),mine=duties.filter(d=>d.assigned_to===user.id&&d.status!=='completed').slice(0,2);return `${game?eventCard(game,true):'<p class="text-zinc-400">Keine kommenden Spiele.</p>'}${training?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Nächstes Training</h2><div class="mt-3">${eventCard(training)}</div>`:''}${mine.length?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Meine Aufgabe</h2><div class="mt-3 space-y-2">${mine.map(dutyRow).join('')}</div>`:''}${messages.length?`<h2 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Neuigkeiten</h2><div class="mt-3 space-y-2">${messages.slice(0,3).map(m=>`<div class="rounded-2xl bg-zinc-900 p-4 text-sm"><b>${esc(m.body)}</b><p class="mt-1 text-xs text-zinc-500">${fmt(m.created_at)}</p></div>`).join('')}</div>`:''}`}
function dutyRow(d){const e=events.find(x=>x.id===d.event_id),label=d.category==='kit_bag'?'Trikottasche':'Kampfgericht';const canClaim=!d.assigned_to||d.assigned_to===user.id;return `<div class="rounded-2xl bg-zinc-900 p-4"><div class="flex items-center justify-between gap-3"><div><b>${label}</b><p class="text-xs text-zinc-400">${e?day(e.starts_at):''} · ${d.status==='confirmed'?'Vom Trainer bestätigt':d.status==='claimed'?'Wartet auf Bestätigung':d.status==='completed'?'Erledigt':'Offen'}</p></div>${canClaim&&d.status==='open'?`<button onclick="claimDuty('${d.id}')" class="${btn} bg-amber-400 text-black">Übernehmen</button>`:''}</div></div>`}
function appointments(){const months={};events.forEach(e=>{const key=new Date(e.starts_at).toLocaleDateString('de-DE',{month:'long',year:'numeric'});(months[key]??=[]).push(e)});return `<h2 class="text-2xl font-black">Termine</h2>${Object.entries(months).map(([m,list])=>`<section class="mt-6"><h3 class="mb-3 text-sm font-black uppercase tracking-widest text-zinc-400">${m}</h3><div class="space-y-3">${list.map(e=>eventCard(e)).join('')}</div></section>`).join('')}`}
function tasks(){const upcoming=duties.filter(d=>{const e=events.find(x=>x.id===d.event_id);return e&&new Date(e.starts_at)>new Date()});const mine=upcoming.filter(d=>d.assigned_to===user.id||!d.assigned_to);return `<h2 class="text-2xl font-black">Aufgaben</h2><p class="mt-1 text-sm text-zinc-400">Kampfgericht und Trikottasche werden getrennt gezählt. Erledigt erst nach Trainer-Bestätigung.</p><div class="mt-5 space-y-2">${mine.length?mine.map(dutyRow).join(''):'<div class="rounded-2xl bg-zinc-900 p-5 text-zinc-400">Aktuell keine offene Aufgabe.</div>'}</div>`}
function statsView(){const players=roster.filter(r=>r.role==='player'&&r.profile_id);if(boxscoreEvent){const game=events.find(e=>e.id===boxscoreEvent);return `<div class="flex items-center justify-between"><h2 class="text-2xl font-black">Boxscore</h2><button onclick="boxscoreEvent=null;render()" class="text-sm text-zinc-400">Zurück</button></div><p class="mt-1 text-zinc-400">${esc(game?.opponent||'Spiel')}</p><form id="statsForm" class="mt-5 overflow-hidden rounded-3xl bg-zinc-900"><div class="grid grid-cols-[1fr_45px_45px_45px_45px] gap-1 border-b border-zinc-800 p-3 text-center text-xs font-black text-zinc-400"><span class="text-left">Spieler</span><span>2PM</span><span>3PM</span><span>FTM</span><span>PF</span></div>${players.map(p=>{const s=stats.find(x=>x.event_id===boxscoreEvent&&x.user_id===p.profile_id)||{};return `<div class="statRow grid grid-cols-[1fr_45px_45px_45px_45px] items-center gap-1 border-b border-zinc-800 p-3" data-user="${p.profile_id}"><b class="text-sm">${esc(p.full_name)}</b>${['two_pm','three_pm','ftm','pf'].map(k=>`<input type="number" min="0" name="${k}" value="${s[k]??0}" class="w-full rounded-lg bg-zinc-800 p-2 text-center">`).join('')}</div>`}).join('')}<button class="${btn} m-4 w-[calc(100%-2rem)] bg-amber-400 text-black">Boxscore speichern</button></form>`}const total={};stats.forEach(s=>{const t=total[s.user_id]??={gp:new Set(),two_pm:0,three_pm:0,ftm:0,pf:0,pts:0};t.gp.add(s.event_id);t.two_pm+=s.two_pm;t.three_pm+=s.three_pm;t.ftm+=s.ftm;t.pf+=s.pf;t.pts+=s.points});const completed=events.filter(e=>e.type==='game'&&results[e.id]);return `<h2 class="text-2xl font-black">Saisonstatistik</h2><p class="mt-1 text-sm text-zinc-400">Nur Trainer sehen diese Ansicht.</p><section class="mt-5 overflow-x-auto rounded-3xl bg-zinc-900"><table class="w-full text-sm"><thead class="text-left text-xs text-zinc-400"><tr><th class="p-3">Spieler</th><th>Sp.</th><th>2PM</th><th>3PM</th><th>FTM</th><th>PF</th><th>PTS</th><th>PPS</th></tr></thead><tbody>${players.map(p=>{const t=total[p.profile_id]||{gp:new Set(),two_pm:0,three_pm:0,ftm:0,pf:0,pts:0};const g=t.gp.size;return `<tr class="border-t border-zinc-800"><td class="p-3 font-bold">${esc(p.full_name)}</td><td>${g}</td><td>${t.two_pm}</td><td>${t.three_pm}</td><td>${t.ftm}</td><td>${t.pf}</td><td class="font-bold">${t.pts}</td><td>${g?(t.pts/g).toFixed(1):'–'}</td></tr>`}).join('')||'<tr><td class="p-3">Noch keine freigeschalteten Spieler.</td></tr>'}</tbody></table></section><h3 class="mt-7 text-sm font-black uppercase tracking-widest text-zinc-400">Spiele mit Ergebnis</h3><div class="mt-3 space-y-2">${completed.length?completed.map(e=>`<button onclick="boxscoreEvent='${e.id}';render()" class="flex w-full items-center justify-between rounded-2xl bg-zinc-900 p-4 text-left"><span><b>${esc(e.home?'vs ':'@ ')+esc(e.opponent)}</b><span class="block text-xs text-zinc-400">${results[e.id].team_score} : ${results[e.id].opponent_score}</span></span><span class="text-amber-400">Boxscore ›</span></button>`).join(''):'<p class="rounded-2xl bg-zinc-900 p-4 text-sm text-zinc-400">Noch kein Ergebnis eingetragen.</p>'}</div>`}
function admin(){const past=events.filter(e=>e.type==='game'&&new Date(e.starts_at)<new Date());const dutyCounts={};duties.filter(d=>d.status==='completed').forEach(d=>dutyCounts[d.assigned_to]=(dutyCounts[d.assigned_to]||0)+1);const claims=duties.filter(d=>d.status==='claimed');return `<h2 class="text-2xl font-black">Trainerbereich</h2><section class="mt-5 rounded-3xl bg-zinc-900 p-5"><h3 class="font-black">Zugangsanfragen</h3>${requests.length?requests.map(r=>`<div class="mt-3 flex items-center justify-between"><b>${esc(r.profiles?.full_name||'Neues Teammitglied')}</b><span class="space-x-3"><button onclick="review('${r.id}',true)" class="font-bold text-emerald-400">Annehmen</button><button onclick="review('${r.id}',false)" class="font-bold text-red-400">Ablehnen</button></span></div>`).join(''):'<p class="mt-2 text-sm text-zinc-400">Keine offenen Anfragen.</p>'}</section><section class="mt-4 rounded-3xl bg-zinc-900 p-5"><h3 class="font-black">Aufgaben bestätigen</h3>${claims.length?claims.map(d=>`<div class="mt-3 flex items-center justify-between gap-3"><span><b>${esc(nameFor(d.assigned_to))}</b><span class="block text-xs text-zinc-400">${d.category==='kit_bag'?'Trikottasche':'Kampfgericht'}</span></span><button onclick="confirmDuty('${d.id}')" class="${btn} bg-emerald-500">Bestätigen</button></div>`).join(''):'<p class="mt-2 text-sm text-zinc-400">Keine Aufgabe wartet auf Bestätigung.</p>'}</section><section class="mt-4 rounded-3xl bg-zinc-900 p-5"><h3 class="font-black">Nachricht ans Team</h3><form id="messageForm" class="mt-3 flex gap-2"><input name="body" required maxlength="500" class="min-w-0 flex-1 rounded-xl bg-zinc-800 p-3" placeholder="z. B. Treffzeit wird noch bekannt gegeben"><button class="${btn} bg-amber-400 text-black">Senden</button></form></section><section class="mt-4 rounded-3xl bg-zinc-900 p-5"><h3 class="font-black">Ergebnisse</h3>${past.length?past.map(e=>`<form class="resultForm mt-3 grid grid-cols-[1fr_64px_16px_64px] items-center gap-2" data-event="${e.id}"><span class="text-sm font-bold">${esc(e.opponent)}</span><input required min="0" type="number" name="team" value="${results[e.id]?.team_score??''}" class="rounded-lg bg-zinc-800 p-2"><b>:</b><input required min="0" type="number" name="opp" value="${results[e.id]?.opponent_score??''}" class="rounded-lg bg-zinc-800 p-2"><button class="${btn} col-span-4 mt-1 bg-zinc-800">Ergebnis speichern</button></form>`).join(''):'<p class="mt-2 text-sm text-zinc-400">Sobald ein Spiel vorbei ist, erscheint es hier.</p>'}</section><section class="mt-4 rounded-3xl bg-zinc-900 p-5"><h3 class="font-black">Aufgaben-Überblick (nur Trainer)</h3><div class="mt-3 space-y-2 text-sm">${roster.filter(r=>r.role==='player').map(r=>`<div class="flex justify-between"><span>${esc(r.full_name)}</span><b>${dutyCounts[r.profile_id]||0} bestätigt</b></div>`).join('')}</div></section>`}
function render(){if(!role){app.innerHTML=`<section class="mx-auto mt-20 max-w-md rounded-3xl bg-zinc-900 p-6 text-center"><div class="text-4xl">🏀</div><h1 class="mt-3 text-2xl font-black">Zugang anfordern</h1><p class="mt-2 text-zinc-400">Gib deinen richtigen Namen ein. Ein Trainer schaltet dich frei.</p><form id="accessForm" class="mt-5 space-y-3"><input required name="name" class="w-full rounded-xl bg-zinc-800 p-3" placeholder="Vor- und Nachname"><button class="${btn} w-full bg-amber-400 text-black">U18-Zugang anfragen</button></form><button onclick="signout()" class="mt-4 text-sm text-zinc-400">Abmelden</button></section>`;document.querySelector('#accessForm').onsubmit=e=>{e.preventDefault();requestAccess(new FormData(e.target).get('name'))};return}app.innerHTML=`${header()}<section>${tab==='home'?home():tab==='termine'?appointments():tab==='aufgaben'?tasks():tab==='stats'?statsView():admin()}</section>${nav()}`;document.querySelector('#messageForm')?.addEventListener('submit',sendMessage);document.querySelectorAll('.resultForm').forEach(f=>f.addEventListener('submit',saveResult));document.querySelector('#statsForm')?.addEventListener('submit',saveStats)}
async function answer(id,s){const reason=s==='no'?prompt('Absage-Grund (optional):')||null:null;const {error}=await db.from('attendance').upsert({event_id:id,user_id:user.id,status:s,absence_reason:reason},{onConflict:'event_id,user_id'});if(error)alert(error.message);else load()}
async function claimDuty(id){const {error}=await db.from('duty_assignments').update({assigned_to:user.id,status:'claimed'}).eq('id',id);if(error)alert(error.message);else load()}
async function confirmDuty(id){const {error}=await db.from('duty_assignments').update({status:'completed',confirmed_by:user.id,confirmed_at:new Date().toISOString(),completed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}
async function requestAccess(fullName){const p=await db.from('profiles').update({full_name:fullName.trim()}).eq('id',user.id);if(p.error){alert(p.error.message);return}const {error}=await db.rpc('request_team_access',{p_season_id:SEASON});if(error)alert(error.message);else app.innerHTML='<p class="mt-20 text-center text-lg font-bold">Anfrage gesendet. Ein Trainer schaltet dich frei.</p>'}
async function review(id,ok){const {error}=await db.rpc('review_team_access',{p_request_id:id,p_approve:ok});if(error)alert(error.message);else load()}
async function sendMessage(e){e.preventDefault();const body=new FormData(e.target).get('body').trim();const {error}=await db.from('messages').insert({season_id:SEASON,author_id:user.id,body});if(error)alert(error.message);else e.target.reset()}
async function saveResult(e){e.preventDefault();const f=e.currentTarget,d=new FormData(f);const {error}=await db.from('game_results').upsert({event_id:f.dataset.event,team_score:+d.get('team'),opponent_score:+d.get('opp'),entered_by:user.id},{onConflict:'event_id'});if(error)alert(error.message);else load()}
async function saveStats(e){e.preventDefault();const rows=[...document.querySelectorAll('.statRow')].map(r=>({event_id:boxscoreEvent,user_id:r.dataset.user,two_pm:+r.querySelector('[name="two_pm"]').value||0,three_pm:+r.querySelector('[name="three_pm"]').value||0,ftm:+r.querySelector('[name="ftm"]').value||0,pf:+r.querySelector('[name="pf"]').value||0}));const {error}=await db.from('player_game_stats').upsert(rows,{onConflict:'event_id,user_id'});if(error)alert(error.message);else load()}
async function signout(){await db.auth.signOut();location.reload()}
db.auth.getSession().then(({data})=>{user=data.session?.user;user?load():login()});db.auth.onAuthStateChange((_e,s)=>{if(s&&!user){user=s.user;load()}});
</script>
</body>
</html>
